<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/media/brand/favicon.svg" type="image/svg+xml"><link rel="icon" href="/media/brand/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="/media/brand/apple-touch-icon.png">
<title>openLN | Wallet</title>
<style>
/* openLN design system v3 — Linear-precision dark + openLN teal/gold identity
   Luminance hierarchy: #080a0a canvas → rgba white surfaces. One accent pair.
   Typography: Inter (450/510/590 weights), JetBrains Mono for money. */
:root{
  --bg:#080a0a; --bg2:#0c0f0f;
  --surface:rgba(255,255,255,.025); --surface2:rgba(255,255,255,.045); --surface3:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.11);
  --text:#f2f5f4; --text2:#9aa8a5; --text3:#5f6d6a;
  --teal:#14b8a6; --teal-dim:rgba(20,184,166,.14); --teal-line:rgba(20,184,166,.35);
  --gold:#f5c518; --gold-dim:rgba(245,197,24,.12);
  --ok:#34d399; --err:#f87171;
  --r-sm:6px; --r-md:8px; --r-lg:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-feature-settings:"cv01","ss03"}
body{background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(1100px 500px at 75% -12%, rgba(20,184,166,.055), transparent 62%),
  radial-gradient(700px 400px at -10% 108%, rgba(245,197,24,.028), transparent 60%);
  pointer-events:none}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.muted{color:var(--text2)}.dim{color:var(--text3)}

/* light theme */
html.light{--bg:#f4f7f6;--bg2:#eef3f2;--surface:rgba(6,40,38,.035);--surface2:rgba(6,40,38,.06);--surface3:rgba(6,40,38,.09);--line:rgba(6,40,38,.12);--line2:rgba(6,40,38,.18);--text:#0a1a19;--text2:#435754;--text3:#748a87}
html.light body{background:var(--bg);color:var(--text)}
html.light body::before{background:radial-gradient(1100px 500px at 75% -12%, rgba(20,184,166,.08), transparent 62%),radial-gradient(700px 400px at -10% 108%, rgba(232,180,9,.06), transparent 60%)}
html.light header.top{background:rgba(244,247,246,.85);border-bottom:1px solid var(--line)}
html.light .modalbox{background:#fff;box-shadow:0 24px 70px rgba(6,40,38,.25)}
html.light .balance{background:linear-gradient(160deg, rgba(6,40,38,.05), rgba(6,40,38,.02))}
html.light .btn.gold{box-shadow:0 6px 18px rgba(232,180,9,.25)}
.themetoggle{width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);display:grid;place-items:center;cursor:pointer;font-size:14px;color:var(--text2);transition:.15s}
.themetoggle:hover{color:var(--text);border-color:var(--teal-line)}
/* shell */
.shell{max-width:1180px;margin:0 auto;padding:0 32px 90px}
header.top{position:sticky;top:0;z-index:40;background:rgba(8,10,10,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);margin:0 -32px;padding:0 32px}
.topin{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:590;letter-spacing:-.3px}.brand em{font-style:normal;color:var(--teal);margin-left:-.5px}
.brand .lnmark{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#0d3d3a,#123f3c);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
.brand .lnmark svg{display:block}
.brand em{font-style:normal;color:var(--teal)}
nav.tabs{display:none}
nav.tabs button{padding:7px 13px;border-radius:var(--r-sm);font-size:13.5px;font-weight:510;color:var(--text2);transition:.15s}
.menu-btn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:9px;color:var(--text2);font-size:19px;line-height:1;transition:.15s}
.menu-btn:hover{color:var(--text);border-color:var(--teal-line);background:var(--surface2)}
.drawer-backdrop{position:fixed;inset:0;z-index:80;background:#050a09}
.drawer{position:absolute;top:0;right:0;height:100%;width:min(330px,calc(100vw - 44px));background:#0a1211;border-left:1px solid var(--line2);padding:22px 18px;box-shadow:-30px 0 80px rgba(0,0,0,.6);animation:drawerIn .18s ease-out}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.drawer-title{font-size:14px;font-weight:590;color:var(--text2);letter-spacing:.02em}
.drawer-nav{display:grid;gap:6px}
.drawer-link{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 13px;border-radius:9px;color:var(--text2);text-align:left;font-size:14px;transition:.13s}
.drawer-link:hover,.drawer-link.on{background:var(--surface2);color:var(--text)}
.drawer-link .arrow{color:var(--text3);font-size:16px}
.drawer-divider{height:1px;background:var(--line);margin:14px 0}
.header-actions{display:flex;align-items:center;gap:8px}
.menu-btn,.themetoggle,.xbtn{min-width:44px;min-height:44px;touch-action:manipulation}
.brand{font-size:19px;letter-spacing:-.55px;gap:9px}
.brand .lnmark{width:30px;height:30px;border-radius:0;background:none;box-shadow:none}
.brand .lnmark svg{width:30px;height:30px}
.brand span{font-size:inherit}
.drawer-backdrop{background:#050a09;z-index:1000}
.drawer{display:flex;flex-direction:column;width:min(360px,calc(100vw - 32px));padding:20px 18px calc(24px + env(safe-area-inset-bottom));background:var(--bg2);overflow-y:auto;overscroll-behavior:contain;animation:drawerIn .16s ease-out}
.drawer-head{margin-bottom:28px}
.drawer-link{gap:14px;min-height:62px;padding:13px 14px;font-size:16px;font-weight:510;border:1px solid transparent;touch-action:manipulation}
.drawer-link>svg{flex-shrink:0;color:var(--text2)}
.drawer-label{flex:1}.drawer-label small{display:block;font-size:12px;color:var(--text2);font-weight:400;margin-top:2px}
.drawer-link.on{background:var(--teal-dim);border-color:var(--teal-line);color:var(--text)}
.drawer-link.on>svg{color:var(--teal)}
.drawer-foot{margin-top:auto;padding:30px 14px 0;display:grid;gap:10px}
.drawer-foot>a,.drawer-foot>button{min-height:44px;display:flex;align-items:center;justify-content:space-between;text-align:left;color:var(--text2);font-size:13px}
.drawer-foot>small{margin-top:12px;font-size:11px;line-height:1.6;color:var(--text3)}
.drawer-divider{margin:16px 14px}.view-loading{display:flex;align-items:center;justify-content:center;gap:12px;padding:90px 20px;color:var(--text2);font-size:14px;flex-wrap:wrap}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:4px}
html.light .drawer-backdrop{background:#dde6e3}html.light .drawer{background:#f7faf9}
@keyframes drawerIn{from{transform:translateX(14px)}to{transform:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
nav.tabs button:hover,nav.tabs a{padding:7px 13px;border-radius:var(--r-sm);font-size:13.5px;font-weight:510;color:var(--text2);transition:.15s}
nav.tabs button:hover,nav.tabs a:hover{color:var(--text);background:var(--surface2)}
nav.tabs button.on{color:var(--text);background:var(--surface3);box-shadow:inset 0 0 0 1px var(--line)}
.uavatar{width:30px;height:30px;border-radius:50%;background:var(--teal-dim);box-shadow:inset 0 0 0 1px var(--teal-line);display:grid;place-items:center;color:var(--teal);font-size:12px;font-weight:590}

/* type */
.overline{font-size:10.5px;font-weight:590;letter-spacing:.14em;text-transform:uppercase;color:var(--text3)}
h1.page{font-size:27px;font-weight:590;letter-spacing:-.68px;line-height:1.1;margin-top:7px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 24px}
.card+.card{margin-top:14px}
.card h3{font-size:14.5px;font-weight:590;letter-spacing:-.18px;display:flex;align-items:center;justify-content:space-between}
.card h3 .side{font-size:12px;font-weight:450;color:var(--text3)}

/* balance hero */
.balance{position:relative;overflow:hidden;border:1px solid var(--line2);background:
  radial-gradient(560px 240px at 88% -30%, rgba(20,184,166,.13), transparent 70%),
  linear-gradient(160deg, rgba(255,255,255,.045), rgba(255,255,255,.018));
  border-radius:16px;padding:30px 32px;margin:26px 0 14px}
.balance::after{content:'';position:absolute;right:-70px;top:-90px;width:300px;height:300px;border-radius:50%;border:1px solid rgba(20,184,166,.16);pointer-events:none}
.balance .blabel{display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px rgba(52,211,153,.7)}
.dot.off{background:var(--text3);box-shadow:none}
.balance .bval{font-family:'JetBrains Mono',monospace;font-size:44px;font-weight:600;letter-spacing:-1.6px;line-height:1.05;margin:14px 0 3px}
.balance .bval .cur{font-size:15px;font-weight:450;color:var(--text2);letter-spacing:0;margin-left:8px}
.balance .bsrc{font-size:12.5px;color:var(--text3)}
.bacts{display:flex;gap:9px;margin-top:24px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 17px;border-radius:var(--r-sm);font-size:13.5px;font-weight:590;letter-spacing:-.1px;transition:.15s;box-shadow:inset 0 0 0 1px transparent}
.btn.gold{background:var(--teal);color:#eaffff;box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 6px 18px rgba(14,131,136,.22)}
.btn.gold:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--surface2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.ghost:hover{background:var(--surface3)}
.btn.teal{background:var(--teal-dim);color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal-line)}
.btn.teal:hover{background:rgba(20,184,166,.2)}
.btn.danger{background:rgba(248,113,113,.09);color:var(--err);box-shadow:inset 0 0 0 1px rgba(248,113,113,.28)}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}

/* layout grid */
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-top:14px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
@media(max-width:760px){
  .shell{padding:0 16px 40px}
  header.top{margin:0 -16px;padding:0 16px}
  .topin{height:54px}
  nav.tabs button{padding:6px 10px;font-size:12.5px}
  .balance{padding:22px 20px;border-radius:14px;margin-top:18px}
  .balance .bval{font-size:34px;letter-spacing:-1.1px}
  .bacts{flex-direction:column}
  .bacts .btn{width:100%;justify-content:center;padding:12px}
  .card{padding:18px 16px;border-radius:10px}
  .grid{gap:12px;margin-top:12px}
  h1.page{font-size:22px;letter-spacing:-.5px}
  .statgrid{grid-template-columns:1fr 1fr}
  .modalbox{padding:20px 18px}
  .qrwrap img{width:200px !important;height:200px !important}
  .rowtx{padding:12px 0}
  .rowtx .t2{font-size:10.5px}
  .copyrow{flex-direction:column}
  .copyrow .btn{width:100%;justify-content:center}
  .brand span{font-size:19px}
  .uavatar{width:26px;height:26px;font-size:11px}
}

/* activity rows */
.rowtx{display:flex;align-items:center;gap:14px;padding:13px 2px;border-top:1px solid var(--line);cursor:pointer;transition:background .12s}
.rowtx:hover{background:var(--surface)}
.rowtx:first-of-type{border-top:0}
.rowtx .ico{width:34px;height:34px;border-radius:9px;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;flex-shrink:0}
.rowtx .ico.in{background:var(--teal-dim);box-shadow:inset 0 0 0 1px var(--teal-line);color:var(--teal)}
.rowtx .meta{flex:1;min-width:0}
.rowtx .t1{font-size:13.5px;font-weight:510;letter-spacing:-.12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowtx .t2{font-size:11.5px;color:var(--text3);margin-top:2px}
.rowtx .amt{font-family:'JetBrains Mono',monospace;font-size:13.5px;font-weight:500;white-space:nowrap}
.rowtx .amt.in{color:var(--ok)}
.rowtx .amt small{display:block;font-size:10.5px;font-weight:400;color:var(--text2);text-align:right;margin-top:2px}
.txcls{display:inline-block;font-family:'Inter',sans-serif;font-size:10px;font-weight:600;letter-spacing:.02em;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--text2);vertical-align:1px;margin-left:4px}
.txcls.sale{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.txcls.top_up,.txcls.transfer_out{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.txcls.other{color:var(--warn,#e0a83a);border-color:color-mix(in srgb,var(--warn,#e0a83a) 40%,transparent)}
.books-kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.books-kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.books-kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text2)}
.books-kpi .v{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:600;margin-top:4px}
.books-kpi .s{font-size:11px;color:var(--text2);margin-top:2px}
.books-filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.books-filters .full{grid-column:1/-1}
.books-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.books-tbl th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.books-tbl td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.books-tbl td.n,.books-tbl th.n{text-align:right;white-space:nowrap;font-family:'JetBrains Mono',monospace}
.books-tbl tr{cursor:pointer}.books-tbl tr:hover td{background:var(--surface)}
.badge{display:inline-block;font-size:10.5px;font-weight:590;padding:2.5px 8px;border-radius:999px;letter-spacing:.02em}
.badge.ok{background:rgba(52,211,153,.11);color:var(--ok)}
.badge.pend{background:var(--surface3);color:var(--text2)}
.badge.gold{background:var(--gold-dim);color:var(--gold)}
.badge.err{background:rgba(248,113,113,.12);color:var(--err)}

/* installed extension chips — compact, one line each */
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px 7px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:510;color:var(--text2);cursor:pointer;transition:.13s;white-space:nowrap}
.chip:hover{border-color:var(--teal-line);color:var(--text);background:var(--surface2)}
.chip .cdot{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.chip.off .cdot{background:var(--text3)}
.chipwrap{display:flex;flex-wrap:wrap;gap:7px}
/* marketplace */
.mrow{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.mrow+.mrow{margin-top:8px}
.mrow .mico{width:38px;height:38px;border-radius:10px;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;font-size:15px;flex-shrink:0}
.mrow.on{border-color:var(--teal-line)}
.mrow .mmeta{flex:1;min-width:0}
.mrow .mt1{font-size:13.5px;font-weight:590;letter-spacing:-.12px}
.mrow .mt2{font-size:12px;color:var(--text3);margin-top:2px}
.mcat{display:inline-block;font-size:10px;font-weight:590;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-left:8px}
/* extensions */
.ext{display:flex;align-items:center;gap:12px;padding:12px 13px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);transition:.15s;cursor:pointer;width:100%;text-align:left}
.ext:hover{background:var(--surface2);border-color:var(--line2)}
.ext .exico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:13px;flex-shrink:0}
.ext .exmeta{flex:1;min-width:0}
.ext .ext1{font-size:13px;font-weight:590;letter-spacing:-.1px}
.ext .ext2{font-size:11.5px;color:var(--text3);margin-top:1px}
.ext .arrow{color:var(--text3);font-size:15px}
.extgrid{display:grid;gap:8px}

/* wallet home — WoS-style: hero balance, latest tx, chevron history, bottom action bar */
.wos{display:flex;flex-direction:column;min-height:calc(100vh - 54px)}
.wos-hero{flex:0 0 auto;text-align:center;padding:52px 20px 22px}
.wos-hero .conn{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:590;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:16px}
.wos-hero .conn .dot{margin:0}
.wos-bal{font-family:'JetBrains Mono',monospace;font-size:46px;font-weight:600;letter-spacing:-1.7px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.wos-bal .cur{font-size:15px;font-weight:450;color:var(--text2);letter-spacing:0;margin-left:7px}
.wos-fiat{font-size:13px;color:var(--text3);margin-top:9px}
.wos-latest{margin:6px 14px 0}
.wos-latest .rowtx{padding:15px 4px}
.wos-hist{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:7px;margin:4px 0 12px;color:var(--text3);font-size:13.5px;font-weight:510;cursor:pointer;padding:9px 18px;border-radius:999px;transition:.14s;width:fit-content;margin-left:auto;margin-right:auto}
.wos-hist:hover{color:var(--text2);background:var(--surface)}
.wos-spacer{flex:1 1 auto}
.wos-actions{position:sticky;bottom:0;display:flex;flex-direction:column;gap:10px;padding:14px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--bg) 30%)}
.wos-actions .actrow{display:flex;gap:10px}
.wos-actions .btn{flex:1;justify-content:center;padding:15px 10px;font-size:15.5px;border-radius:999px}
.btn.receive{background:transparent;border:1.5px solid var(--teal);color:var(--teal)}
.btn.receive:hover{background:rgba(14,131,136,.1)}
.btn.send{background:var(--teal);color:#eaffff;border:1.5px solid var(--teal)}
.btn.send:hover{background:#0f9499;filter:brightness(1.02)}
/* POS */
.btn.pos{background:var(--gold);color:#101314;border:1.5px solid var(--gold);font-weight:590}
.btn.pos:hover{filter:brightness(1.04)}
.btn.pos[disabled]{opacity:.55;cursor:default}
.poshead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:6px 0 14px;flex-wrap:wrap}
.posmodes{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;width:fit-content}
.posmodes button{padding:8px 18px;border-radius:999px;font-size:13.5px;font-weight:510;color:var(--text2);transition:.13s}
.posmodes button.on{background:var(--surface3);color:var(--text)}
.posgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:10px}
.postile{position:relative;display:flex;flex-direction:column;gap:7px;padding:11px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);text-align:left;transition:.13s}
.postile:hover{background:var(--surface2);border-color:var(--line2)}
.postile .pimg,.postile .pmono{width:100%;aspect-ratio:1/1;border-radius:7px;object-fit:cover;background:var(--surface2)}
.postile .pmono{display:grid;place-items:center;font-size:30px;font-weight:590;color:var(--text3)}
.postile .pname{font-size:13.5px;font-weight:590;letter-spacing:-.1px;line-height:1.25}
.postile .pprice{font-size:12px;color:var(--text2)}
.postile .pdesc{font-size:11.5px;color:var(--text3);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.postile .pqty{position:absolute;top:7px;right:7px;background:var(--gold);color:#101314;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px}
.posempty{border:1px dashed var(--line2);border-radius:var(--r-md);padding:26px 18px;text-align:center;display:grid;gap:12px;justify-items:center}
.poscart{margin-top:14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);overflow:hidden}
.posline{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.posline:first-child{border-top:0}
.posline .lname{flex:1;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* settings page */

.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.formgrid{grid-template-columns:1fr}}.issued-card-list{display:grid;gap:6px}.issued-card-row{display:flex;align-items:center;gap:9px;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);text-align:left;color:var(--text);cursor:pointer}.issued-card-row:hover{border-color:var(--teal-line)}.card-mini{width:29px;height:19px;border-radius:4px;background:linear-gradient(135deg,#123f3c,#0b1f1e);display:grid;place-items:center;flex-shrink:0}.card-mini-mark{color:var(--teal);font-size:15px;line-height:1}.issued-card-meta{flex:1;min-width:0}.issued-card-meta b{display:block;font-size:12px;font-weight:590}.issued-card-meta small{display:block;color:var(--text3);font-size:10.5px;margin-top:2px}
.manage-actions{display:flex;flex-wrap:wrap;gap:7px}.manage-section{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.manage-section .label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}.manage-line{display:flex;justify-content:space-between;padding:5px 0;font-size:12px}.dangerText{color:var(--err)!important}
/* real card face — CR80 ratio 85.6x54mm ≈ 1.586:1 */
.cardface{position:relative;width:100%;max-width:340px;aspect-ratio:1.586/1;border-radius:16px;margin:0 auto;padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
  background:radial-gradient(120% 140% at 100% 0%, rgba(20,184,166,.35), transparent 55%),radial-gradient(120% 140% at 0% 100%, rgba(245,197,24,.10), transparent 50%),linear-gradient(155deg,#0e2b29 0%,#0a1917 55%,#071211 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 18px 40px -12px rgba(0,0,0,.6);color:#eafffd}
.cardface::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0px,rgba(255,255,255,.025) 1px,transparent 1px,transparent 5px);pointer-events:none}
.cardface.frozen{filter:saturate(.35) brightness(.85)}
.cardface.cancelled{filter:grayscale(1) brightness(.6)}
.cardface-top{display:flex;align-items:flex-start;justify-content:space-between;position:relative;z-index:1}
.cardface-chip{width:34px;height:25px;border-radius:5px;background:linear-gradient(155deg,#e8d38a,#b8964f);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);position:relative}
.cardface-chip::before,.cardface-chip::after{content:'';position:absolute;background:rgba(0,0,0,.22)}
.cardface-chip::before{left:50%;top:4px;bottom:4px;width:1px}
.cardface-chip::after{top:50%;left:4px;right:4px;height:1px}
.cardface-badge{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;padding:4px 9px;border-radius:20px;background:rgba(20,184,166,.18);color:#7cf5df;backdrop-filter:blur(2px)}
.cardface-badge.frozen{background:rgba(245,197,24,.18);color:var(--gold)}
.cardface-badge.cancelled{background:rgba(248,113,113,.18);color:#ffb3b3}
.cardface-mid{position:relative;z-index:1;font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.14em;color:rgba(234,255,253,.55)}
.cardface-bottom{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}

.qrbox{display:grid;place-items:center;background:#0a0f0f;border-radius:10px;padding:16px;margin-bottom:14px;min-height:252px}
.qrbox img{width:220px;height:220px;display:block}
.qrbox .dim{font-size:12px}
/* RIC */
.ricgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;max-width:520px}
.rictile{text-align:left;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:8px;transition:.15s}
.rictile:hover{border-color:var(--teal-line);transform:translateY(-1px)}
.rictile-ico{width:34px;height:34px;border-radius:9px;background:var(--teal-dim);color:var(--teal);display:grid;place-items:center;font-size:16px}

.rictile-sub{font-size:11.5px;color:var(--text3)}

.ricrow-top{display:flex;align-items:center;gap:7px;font-size:13.5px}
.ricdot{width:7px;height:7px;border-radius:50%;background:var(--text3);opacity:.5;display:inline-block}

.ricsteps{display:flex;flex-direction:column;gap:10px}

.ricstep.active{opacity:1;border-color:var(--teal-line);background:var(--teal-dim)}

.ricstep-label{font-size:13px;font-weight:590;margin-bottom:6px}
.ricprogress{height:6px;background:var(--surface3);border-radius:4px;overflow:hidden}

.warnbox{border:1px solid rgba(248,113,113,.3);background:rgba(248,113,113,.08);color:#ffb3b3;border-radius:var(--r-md);padding:13px 14px;font-size:12.5px;line-height:1.5}

.ricform .input{width:100%}

.ricsteps-plain{counter-reset:ricstep}

.backlink{font-size:12.5px;color:var(--text2);display:inline-flex;align-items:center;gap:4px;padding:6px 2px}.backlink:hover{color:var(--text)}

/* forms */
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:12px;font-weight:510;color:var(--text2);margin-bottom:6px}
.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 13px;font-size:14px;color:var(--text);transition:.15s}
/* Chrome paints <option> with its own default (white) background and ignores the select's colours; Firefox inherits. Style options explicitly everywhere. */
select.input,select.input option,select.input optgroup{background:var(--bg2);color:var(--text)}
select.input{color-scheme:dark}
.input:focus{outline:none;border-color:var(--teal-line);background:var(--surface2)}
.input.mono{font-family:'JetBrains Mono',monospace;font-size:12.5px}

let liveSource,liveRetry=5000,liveRetryT=null;
function startLiveUpdates(){
  if(liveSource && liveSource.readyState!==EventSource.CLOSED)return;
  liveSource = new EventSource('/api/events?token=' + encodeURIComponent(tok()));
  liveSource.onopen = () => { liveRetry=5000; };
  liveSource.addEventListener('payment', () => { if (VIEW === 'wallet') render(); });
  liveSource.onerror = () => {
    liveSource.close();
    if(liveRetryT)clearTimeout(liveRetryT);
    liveRetryT=setTimeout(async () => {
      if(!tok())return;
      try{ await api('/api/me'); }
      catch(e){
        if(e&&e.status===401){ localStorage.removeItem('openln_token'); if(VIEW!=='partner'){ closeDrawer(false); login(); } return; }
      }
      startLiveUpdates();
    }, liveRetry);
    liveRetry = Math.min(liveRetry*2, 60000);
  };
}

function posBump(id,d){const i=pos.cart.findIndex(l=>l.id===id);if(i<0)return;pos.cart[i].qty+=d;if(pos.cart[i].qty<=0)pos.cart.splice(i,1);posPaintBody()}

async function posCharge(){

  const sats=custom?posEnteredSats():posSats(fv);
  if(sats==null||sats<1){toast('Exchange rate unavailable. Try again in a moment.');return}
  const lines=pos.mode==='numpad'?'':pos.cart.map(l=>(l.qty>1?l.qty+'x ':'')+l.name).join(', ');
  const memo=[lines||'POS sale',pos.note.trim()].filter(Boolean).join(' · ').slice(0,140);
  pos.busy=true;
  const btn=$('#posCharge');if(btn)btn.disabled=true;
  try{
    const inv=await api('/api/pos/invoice',{method:'POST',body:JSON.stringify({amountSats:sats,memo,purpose:'sale'})});
    let fiatVal=fv;if(custom&&pos.cur!=='sats'&&posUnit()==='sats')fiatVal=(pos.rate||0)>0?sats*(pos.rate||0)/1e8:0;

  finally{pos.busy=false}
}
function posStartPoll(){
  if(pos.pollT)clearInterval(pos.pollT);
  const hash=pos.inv.paymentHash;
  const tick=async()=>{
    if(VIEW!=='pos'||pos.stage!=='pay'){clearInterval(pos.pollT);pos.pollT=null;pos.resumeCheck=null;return}
    try{
      const s=await api('/api/pos/invoice/'+encodeURIComponent(hash)+'/status');
      if(s.status==='paid'){clearInterval(pos.pollT);pos.pollT=null;pos.resumeCheck=null;posToDone();return}
      if(['expired','cancelled','unknown','needs_reconciliation'].includes(s.status)){clearInterval(pos.pollT);pos.pollT=null;pos.resumeCheck=null;posToClosed(s.status);return}
      posPayStatus(s.status);
    }catch(e){
      if(e&&e.status===401){clearInterval(pos.pollT);pos.pollT=null;pos.resumeCheck=null;if(liveSource)liveSource.close();localStorage.removeItem('openln_token');if(VIEW!=='partner'){closeDrawer(false);login()}}
    }
  };
  pos.resumeCheck=tick;

}

async function posCancelSale(){

function posShrinkImage(file,size=256,q=0.72){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=async()=>{
      try{
        let w=img.naturalWidth||size,h=img.naturalHeight||size;
        if(w>=h&&w>size){h=Math.round(h*size/w);w=size}else if(h>w&&h>size){w=Math.round(w*size/h);h=size}
        const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
        const data=c.toDataURL('image/jpeg',q);
        URL.revokeObjectURL(url);
        if(data.length>45000&&size>160){res(await posShrinkImage(file,160,0.6));return}
        res(data);
      }catch(e){URL.revokeObjectURL(url);rej(e)}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(Error('image'))};
    img.src=url;
  });
}

/* ---- SEND ---- */
/* Camera-first send: a fullscreen scanner with Paste / Keyboard / Images at the
   bottom that accepts BOLT11, lightning addresses and every LNURL type. A scan
   resolves through /api/wallet/resolve (minting the payee invoice when an
   amount is chosen) and pays through the ordinary /api/wallet/pay route.
   The address book is device-local (localStorage). */
let snd={stage:'scan',root:null,stream:null,scanning:false,loopId:0,tickT:null,torch:false,input:'',target:null,invoice:null,unit:'',amount:'',comment:'',purpose:'spend',busy:false,fired:false,msg:'',tx:'',retryStage:'',fx:null};
const SND_BOOK_KEY='openln_addr_book';
function sndBookList(){try{const a=JSON.parse(localStorage.getItem(SND_BOOK_KEY)||'[]');return Array.isArray(a)?a.filter(x=>typeof x==='string'):[]}catch(e){return[]}}
function sndBookHas(a){return sndBookList().indexOf(a)>-1}
function sndBookSave(a){a=String(a||'').trim().toLowerCase();if(!a||a.indexOf('@')<0)return;if(sndBookHas(a)){toast('Already in your address book');return}const l=sndBookList();l.unshift(a);try{localStorage.setItem(SND_BOOK_KEY,JSON.stringify(l.slice(0,24)))}catch(e){}toast('Saved to your address book')}
function sndBookRemove(a){try{localStorage.setItem(SND_BOOK_KEY,JSON.stringify(sndBookList().filter(x=>x!==a)))}catch(e){}toast('Removed from your address book')}
function sndEl(sel){return snd.root?snd.root.querySelector(sel):null}
let zx={mod:null,state:0,err:0}; // zxing-wasm camera decoder: state 0 idle, 1 loading, 2 ready, 3 failed
const SND_BUILD='2026-09-28f'; // bump on scanner changes; shown by the ?sd=1 diagnostic
const SND_DEBUG=(typeof location!=='undefined'&&/[?&]sd=1/.test(location.search||''));
const SND_LAB=(typeof location!=='undefined'&&/[?&]sd=2/.test(location.search||''));
let sndDbg={tick:0,detBad:0,det:'?',zxMs:0,err:'',last:'',set:'',caps:'',shot:'',timer:null,canvas:null,pAt:0,pTick:0};
function sndDbgPaint(){
  if(!SND_DEBUG||!snd.root||snd.stage!=='scan')return;
  const t=snd.root.querySelector('#sndDbgTx');if(!t)return;
  const now=Date.now(),dt=(now-(sndDbg.pAt||now))/1000;
  const rate=(sndDbg.pAt&&dt>0)?Math.round((sndDbg.tick-sndDbg.pTick)/dt):0;
  sndDbg.pAt=now;sndDbg.pTick=sndDbg.tick;
  t.textContent='openLN scan diag '+SND_BUILD+'\nstream '+(sndDbg.set||'...')+'\ncaps '+(sndDbg.caps||'...')+'\ndet '+sndDbg.det+' bad'+sndDbg.detBad+' zx'+zx.state+(sndDbg.zxMs?' '+sndDbg.zxMs+'ms':'')+'\ntick '+rate+'/s n'+sndDbg.tick+'\nshot '+sndDbg.shot+' f'+(snd.shotFail||0)+(snd.shotOff?' OFF':'')+' rep'+(snd.repCount||0)+' zoom'+(snd.zoom||1)+'\n'+(sndDbg.err?'err '+sndDbg.err+'\n':'')+(sndDbg.last?'last '+sndDbg.last:'waiting for a read');
  const th=snd.root.querySelector('#sndDbgTh');
  if(th&&sndDbg.canvas){try{th.getContext('2d').drawImage(sndDbg.canvas,0,0,th.width,th.height)}catch(e){}}

}
function sndZx(){if(zx.state)return;zx.state=1;import('/media/zxing.mjs').then(m=>{try{if(m.prepareZXingModule)m.prepareZXingModule({overrides:{locateFile:(p,pre)=>String(p).indexOf('.wasm')>-1?'/media/'+p:pre+p}})}catch(e){}zx.mod=m;zx.state=2}).catch(()=>{zx.state=3})}
async function sndZxReady(ms){
  if(zx.state===0)sndZx();
  const t0=Date.now();
  while(zx.state===1&&Date.now()-t0<ms)await new Promise(r=>setTimeout(r,50));
  return zx.state===2;
}
function sndFrame(v,c,n,cap,frac){
  const w=v.videoWidth||0,h=v.videoHeight||0;
  if(!w||!h)return null;
  let sx=0,sy=0,sw=w,sh=h;
  if(frac>0&&frac<1){const side=Math.round(Math.min(w,h)*frac);sw=side;sh=side;sx=Math.round((w-side)/2);sy=Math.round((h-side)/2)}
  else if(frac===undefined&&n%2===1){const side=Math.round(Math.min(w,h)*.78);sw=side;sh=side;sx=Math.round((w-side)/2);sy=Math.round((h-side)/2)}
  const scale=Math.min(1,cap/Math.max(sw,sh));c.width=Math.max(1,Math.round(sw*scale));c.height=Math.max(1,Math.round(sh*scale));
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);
  return x.getImageData(0,0,c.width,c.height);
}
let sndShotAt=0; // last close-up still attempt (ms)
function sndShot(){ // full-res frame grab via grabFrame (no photo pipeline, cannot freeze the preview); takePhoto only as last resort on low-res streams
  return new Promise(resolve=>{
    let settled=false;
    const fin=v=>{if(!settled){settled=true;clearTimeout(to);resolve(v)}};
    const to=setTimeout(()=>fin(null),4000);
    (async()=>{
      try{
        const tr=sndTrack(),v=sndEl('#sndVid');
        if(!tr||!('ImageCapture' in window)||!v){fin(null);return}
        const st=tr.getSettings?tr.getSettings():{};
        const hiRes=Math.min(st.width||0,st.height||0)>=1000;
        const ic=new ImageCapture(tr);
        let bmp=null;
        if(hiRes){try{bmp=await ic.grabFrame()}catch(e){bmp=null}}
        if(!bmp){
          if(snd.photoBad){fin(null);return}
          try{
            const blob=await Promise.race([ic.takePhoto(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('tp-timeout')),2500))]);
            if(!blob){snd.photoBad=true;fin(null);return}
            bmp=await createImageBitmap(blob);
          }catch(e){snd.photoBad=true;sndDbg.err='tp-dead';fin(null);return}
        }
        const cap=2560,sc=Math.min(1,cap/Math.max(bmp.width,bmp.height));
        const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(bmp.width*sc));cv.height=Math.max(1,Math.round(bmp.height*sc));
        const x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(bmp,0,0,cv.width,cv.height);
        try{bmp.close()}catch(e){}
        fin(x.getImageData(0,0,cv.width,cv.height));
      }catch(e){fin(null)}
    })();
  });
}
function sndShotRun(){ // kick focus, then decode a full-res still in parallel with the stream loop
  if(snd.shotBusy||snd.shotOff||zx.state!==2||snd.stage!=='scan')return;
  const lid=snd.loopId;
  snd.shotBusy=true;sndShotAt=Date.now();sndDbg.shot='run';
  setTimeout(()=>{
    sndShot().then(g=>{
      snd.shotBusy=false;
      if(!g){snd.shotFail=(snd.shotFail||0)+1;sndDbg.shot='null';if(snd.shotFail>1)snd.shotOff=true;return}
      if(zx.state!==2||snd.stage!=='scan'||snd.loopId!==lid)return;
      zx.mod.readBarcodes(g,{formats:['QRCode'],tryHarder:true,tryRotate:true,tryInvert:true,tryDenoise:true,maxNumberOfSymbols:1}).then(res=>{
        const t=res&&res.length?(res[0].text||''):'';
        sndDbg.shot=t?'ok':'empty';
        if(t&&snd.stage==='scan'&&snd.loopId===lid){snd.shotRaw=t;sndDbg.last='shot '+t.slice(0,16)}
      }).catch(e=>{zx.err++;if(zx.err>6){zx.state=3;zx.mod=null}});
    });
  },320);
}
function sndStopCam(){snd.scanning=false;snd.shotRaw=null;snd.shotBusy=false;if(sndDbg.timer){clearInterval(sndDbg.timer);sndDbg.timer=null}if(snd.tickT){clearTimeout(snd.tickT);snd.tickT=null}if(snd.stream){try{snd.stream.getTracks().forEach(t=>t.stop())}catch(e){}snd.stream=null}}
function sndClose(){sndStopCam();if(snd.root){snd.root.remove();snd.root=null}}
async function sndLoadFx(){if(snd.fx)return;try{const cfg=await api('/api/pos/config');const cur=String(cfg.currency||'').toLowerCase();const fx={cur,rate:null};if(cur&&cur!=='sats'){const qs=new URLSearchParams({vs_currency:cur});if(cfg.sendRateModifier)qs.set('modifier',cfg.sendRateModifier);const p=await api('/api/price?'+qs.toString());if(Number(p&&p.price)>0)fx.rate=Number(p.price)}snd.fx=fx}catch(e){snd.fx={cur:'',rate:null}}}
function sndCur(){return (snd.fx&&snd.fx.cur)||''}
function sndFiatOf(sats){const cur=sndCur(),rate=snd.fx&&snd.fx.rate;if(!cur||cur==='sats'||!rate||!sats)return'';return '≈ '+fmtFiat(sats/1e8*rate,cur)}
function sndSatsOf(fv){const cur=sndCur(),rate=snd.fx&&snd.fx.rate;if(cur&&cur!=='sats'){if(!rate||rate<=0)return null;return Math.round(fv/rate*1e8)}return Math.round(fv)}
function sndAmtSats(){const fv=Number(snd.amount||0);if(!(fv>0))return null;const s=sndSatsOf(fv);return s&&s>0?s:null}
function sndUnit(){const cur=sndCur();if(!cur||cur==='sats')return 'sats';if(snd.unit==='sats'||snd.unit==='fiat')return snd.unit;return (snd.unit=amtUnitPref())}
function sndFiatOfSats(s){const cur=sndCur(),rate=snd.fx&&snd.fx.rate;if(!cur||cur==='sats'||!rate||!(s>0))return'';return '≈ '+fmtFiat(s/1e8*rate,cur)}

        const dres=await Promise.race([det.detect(v).catch(()=>'err'),new Promise(r=>setTimeout(()=>r('slow'),700))]);
        if(dres==='slow'||dres==='err'){sndDbg.detBad++;sndDbg.det=dres==='slow'?'slow':'err';if(sndDbg.detBad>2){det=null;sndDbg.det='off'}}
        else if(dres&&dres.length)raw=dres[0].rawValue;
      }
      if(zx.state===0)sndZx();
      if(!raw&&zx.state===2){
        const g=sndFrame(v,c,n,1280,el>2000?[0,.62,.36][n%3]:undefined);
        if(g){const tD=performance.now();try{const res=await zx.mod.readBarcodes(g,{formats:['QRCode'],tryHarder:true,tryRotate:true,tryInvert:true,tryDownscale:true,tryDenoise:true,maxNumberOfSymbols:1});const t=res&&res.length?(res[0].text||''):'';if(t)raw=t}catch(e){zx.err++;sndDbg.err=String((e&&e.message)||e).slice(0,42);if(zx.err>6){zx.state=3;zx.mod=null}}sndDbg.zxMs=Math.round(performance.now()-tD)}
      }
      if(!raw&&zx.state===3&&!jsqr&&!failed){
        try{const mod=await import('/media/jsqr.mjs');jsqr=mod.default||mod.jsQR}catch(e){failed=true}
        if(failed&&!det){const h=sndEl('#sndHint');if(h)h.textContent='Scanning is not supported in this browser. Use Paste, Keyboard or Images below.';return}
      }
      if(!raw&&!zx.mod&&jsqr){
        const g=sndFrame(v,c,n,1024);
        if(g){const r=jsqr(g.data,g.width,g.height,{inversionAttempts:'attemptBoth'});if(r&&r.data)raw=r.data}
      }
      if(!raw&&snd.shotRaw){raw=snd.shotRaw;snd.shotRaw=null}
      if(!raw&&zx.state===2&&el>2500&&!snd.shotBusy&&Date.now()-sndShotAt>2400)sndShotRun();
      if(raw&&String(raw).trim()){try{if(navigator.vibrate)navigator.vibrate(30)}catch(e){}if(snd.root)snd.root.classList.add('hit');setTimeout(()=>{if(snd.root)snd.root.classList.remove('hit')},450);sndResolve(String(raw));return}
    }catch(e){}
    snd.tickT=setTimeout(tick,150);
  };
  tick();
  if(SND_DEBUG&&!sndDbg.timer)sndDbg.timer=setInterval(sndDbgPaint,400);
}

async function sndDecodeImage(file){
  try{
    let raw=null;
    if('BarcodeDetector' in window){try{const det=new BarcodeDetector({formats:['qr_code']});const bmp=await createImageBitmap(file);const codes=await det.detect(bmp);if(codes&&codes.length)raw=codes[0].rawValue}catch(e){}}
    if(!raw&&await sndZxReady(1500)){
      try{
        const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});
        const w=img.naturalWidth,h=img.naturalHeight,c=document.createElement('canvas');c.width=w;c.height=h;
        const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,w,h);
        const d=x.getImageData(0,0,w,h);
        const res=await zx.mod.readBarcodes(d,{formats:['QRCode'],tryHarder:true,maxNumberOfSymbols:1});
        if(res&&res.length&&res[0].text)raw=res[0].text;
        URL.revokeObjectURL(img.src);
      }catch(e){}
    }
    if(!raw){
      const mod=await import('/media/jsqr.mjs').catch(()=>null);const jsqr=mod&&(mod.default||mod.jsQR);
      if(jsqr){
        const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});
        const w=img.naturalWidth,h=img.naturalHeight,c=document.createElement('canvas');c.width=w;c.height=h;
        const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,w,h);
        const d=x.getImageData(0,0,w,h);const r=jsqr(d.data,w,h,{inversionAttempts:'attemptBoth'});
        if(r&&r.data)raw=r.data;
        URL.revokeObjectURL(img.src);
      }
    }
    if(raw&&String(raw).trim())sndResolve(String(raw));else toast('No QR code found in that image');
  }catch(e){toast('Could not read that image')}
}
function sndKeys(){sndStopCam();snd.stage='keys';sndRender()}
function sndKeysGo(){const i=sndEl('#sndInput');const v=(i?i.value:'').trim();if(!v){toast('Type an invoice or address first');return}sndResolve(v)}
async function sndResolve(raw){
  if(!snd.root)return;
  sndStopCam();
  const input=String(raw||'').trim();snd.input=input;snd.retryStage='';
  snd.stage='resolve';sndRender();
  try{
    const r=await api('/api/wallet/resolve',{method:'POST',body:JSON.stringify({input})});
    snd.target=r;
    if(r.kind==='bolt11'){
      if(!r.amountSats){snd.stage='msg';snd.msg='This invoice does not carry an amount. Ask the payee for an invoice with the amount included.'}
      else{snd.invoice={bolt11:r.bolt11,amountSats:r.amountSats};snd.fired=false;snd.stage='confirm';sndLoadFx().then(()=>sndRender())}
    }
    else if(r.kind==='lnurl_pay'){snd.stage='amount';snd.amount='';snd.comment='';sndLoadFx().then(()=>sndRender())}
    else if(r.kind==='lnurl_withdraw'){snd.stage='withdraw'}
    else{snd.stage='msg';snd.msg=r.message||'This code cannot be paid.'}
  }catch(x){snd.stage='msg';snd.msg=(x&&x.message)?x.message:'Could not read that code.'}
  sndRender();
}
function sndAmountGo(){
  const t=snd.target||{};const err=sndEl('#sndAmtErr');const sats=sndEnteredSats();
  if(!sats){if(err)err.textContent='Enter an amount first';return}
  if(t.minSendableSats&&sats<t.minSendableSats){if(err)err.textContent='Minimum is '+fmt(t.minSendableSats)+' sats';return}
  if(t.maxSendableSats&&sats>t.maxSendableSats){if(err)err.textContent='Maximum is '+fmt(t.maxSendableSats)+' sats';return}
  const ci=sndEl('#sndAmtComment');snd.comment=ci?ci.value:'';
  snd.stage='resolve';sndRender();
  const body={input:snd.input,amountSats:sats};if(snd.comment)body.comment=snd.comment;
  api('/api/wallet/resolve',{method:'POST',body:JSON.stringify(body)}).then(r=>{
    snd.target=Object.assign({},snd.target,r);
    if(r.invoice){if(!r.invoice.amountSats)r.invoice.amountSats=sats;snd.invoice=r.invoice;snd.fired=false;snd.stage='confirm'}
    else{snd.stage='msg';snd.retryStage='amount';snd.msg='The payee did not return an invoice. Try again in a moment.'}
    sndRender();
  }).catch(x=>{snd.stage='msg';snd.retryStage='amount';snd.msg=(x&&x.message)?x.message:'Could not get an invoice.';sndRender()});
}
async function sndPay(){
  if(!snd.root||snd.busy||snd.fired)return;
  const inv=snd.invoice;if(!inv||!inv.bolt11)return;
  snd.fired=true;snd.busy=true;
  const sel=sndEl('#sndPurpose');if(sel)snd.purpose=sel.value||'spend';
  snd.stage='paying';sndRender();
  try{
    const r=await api('/api/wallet/pay',{method:'POST',body:JSON.stringify({bolt11:inv.bolt11,purpose:snd.purpose})});
    if(r&&r.status==='completed'){snd.stage='sent';snd.tx=r.paymentHash||''}
    else{snd.stage='pending'}
  }catch(x){
    if(x&&x.status){snd.stage='perr';snd.msg=(x.message)||'Payment failed.'}
    else{snd.stage='lost'}
  }finally{snd.busy=false}
  sndRender();
}

function sndBind(){
  const stage=snd.stage;
  const done=sndEl('#sndDone');if(done)done.onclick=()=>{sndClose();render()};
  const scan=sndEl('#sndBackScan');if(scan)scan.onclick=()=>{snd.retryStage='';snd.stage='scan';sndRender();sndStartCam()};
  const amt=sndEl('#sndBackAmt');if(amt)amt.onclick=()=>{snd.stage='amount';sndRender()};
  if(stage==='keys'){
    const inp=sndEl('#sndInput');
    if(inp){inp.focus();inp.oninput=()=>{snd.input=inp.value;const b=sndEl('#sndSave');if(b)b.hidden=!(inp.value.indexOf('@')>-1)};inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();sndKeysGo()}}}
    const save=sndEl('#sndSave');if(save)save.onclick=()=>{const i=sndEl('#sndInput');const v=(i?i.value:'').trim().toLowerCase();if(v.indexOf('@')>-1){sndBookSave(v);snd.input=v;sndRender()}};
    const go=sndEl('#sndGo');if(go)go.onclick=()=>sndKeysGo();
    const book=sndEl('#sndBook');
    if(book){
      book.querySelectorAll('[data-fill]').forEach(el=>{el.onclick=()=>{const i=sndEl('#sndInput');if(i){i.value=el.getAttribute('data-fill');i.focus();const b=sndEl('#sndSave');if(b)b.hidden=false}}});
      book.querySelectorAll('[data-rm]').forEach(el=>{el.onclick=()=>{sndBookRemove(el.getAttribute('data-rm'));sndRender()}});
    }
  }
  if(stage==='amount'){
    snd.root.querySelectorAll('button[data-k]').forEach(el=>{el.onclick=()=>sndKey(el.getAttribute('data-k'))});
    const go=sndEl('#sndAmtGo');if(go)go.onclick=()=>sndAmountGo();
    const seg=sndEl('#sndUnitSeg');if(seg){seg.querySelectorAll('button').forEach(b=>{b.onclick=()=>{const to=b.dataset.unit;if(to===sndUnit())return;snd.amount=sndConv(to);snd.unit=to;amtUnitSet(to);sndRender()}})}
  }
  if(stage==='confirm'){
    const pay=sndEl('#sndPay');if(pay)pay.onclick=()=>sndPay();
    const sel=sndEl('#sndPurpose');if(sel)sel.onchange=()=>{snd.purpose=sel.value||'spend'};
    const sv=sndEl('#sndSaveAddr');if(sv)sv.onclick=()=>{const t=snd.target||{};if(t.source)sndBookSave(t.source);sndRender()};
  }
  if(stage==='perr'){const r=sndEl('#sndRetry');if(r)r.onclick=()=>{snd.fired=false;snd.stage='confirm';sndRender()}}
  if(stage==='withdraw'){
    const cp=sndEl('#sndWdCopy');if(cp)cp.onclick=()=>{try{navigator.clipboard.writeText(snd.input);toast('Code copied')}catch(e){}};
    const rc=sndEl('#sndWdRecv');if(rc)rc.onclick=()=>{const t=snd.target||{};const input=snd.input;sndClose();receiveWithdrawModal({input,source:t.source,maxWithdrawableSats:t.maxWithdrawableSats,defaultDescription:t.defaultDescription})};
  }
}
function sndRender(){
  if(!snd.root)return;
  const sheet=sndEl('#sndSheet');const frame=sndEl('#sndFrame');const hint=sndEl('#sndHint');
  if(!sheet)return;
  const scanning=snd.stage==='scan';
  sheet.hidden=scanning;
  if(frame)frame.style.display=scanning?'':'none';
  if(hint)hint.style.display=scanning?'':'none';
  if(scanning){sheet.innerHTML='';return}
  sheet.innerHTML=sndSheetHTML();
  sndBind();
}

function booksRange(f){
  const now=new Date();const d=(y,m,day)=>new Date(Date.UTC(y,m,day));
  const y=now.getUTCFullYear(),m=now.getUTCMonth();
  if(f.preset==='month')return[d(y,m,1),null];
  if(f.preset==='last_month')return[d(y,m-1,1),new Date(d(y,m,1).getTime()-1)];
  if(f.preset==='quarter'){const q=Math.floor(m/3)*3;return[d(y,q,1),null]}
  if(f.preset==='year')return[d(y,0,1),null];
  if(f.preset==='last_year')return[d(y-1,0,1),new Date(d(y,0,1).getTime()-1)];
  if(f.preset==='custom')return[f.from?new Date(f.from):null,f.to?new Date(f.to+'T23:59:59.999Z'):null];
  return[null,null];
}
function booksQuery(f,extra){
  const [from,to]=booksRange(f);const p=new URLSearchParams();
  if(from)p.set('from',from.toISOString());if(to)p.set('to',to.toISOString());
  if(f.cls)p.set('class',f.cls);if(f.origin)p.set('origin',f.origin);if(f.dir)p.set('direction',f.dir);if(f.q)p.set('q',f.q);
  Object.entries(extra||{}).forEach(([k,v])=>p.set(k,v));
  return p.toString();
}

function cardStatusLabel(c){ return c.status==='active'?(c.lastUsedAt?'Active':'Ready to write'):c.status==='frozen'?'Frozen':'Cancelled'; }
function cardTile(c){
  const st=c.status||'active';

      writerAppInstalled().then(inst=>{if(!inst)return;const ow=box.querySelector('#openWriterWipe');if(!ow)return;ow.href=writerIntentUrl('open',{d:wipeJson});ow.style.display='';box.querySelector('#openWriterWipeHint').style.display=''});

        catch(e){toast(e.message)}

const WRITER_APP_PACKAGE='app.bitpos.cardwriter';
const WRITER_APP_APK='/media/card-writer-1.2.5.apk';
async function writerAppInstalled(){
  try{
    if(!navigator.getInstalledRelatedApps)return false;
    const apps=await navigator.getInstalledRelatedApps();
    return (apps||[]).some(a=>a&&(a.id===WRITER_APP_PACKAGE||a.package===WRITER_APP_PACKAGE));
  }catch(e){return false}
}
function writerIntentUrl(path,params){
  const q=new URLSearchParams(params||{}).toString();
  const fallback=encodeURIComponent(location.origin+WRITER_APP_APK);
  return 'intent://'+path+'?'+q+'#Intent;scheme=openlnwriter;package='+WRITER_APP_PACKAGE+';S.browser_fallback_url='+fallback+';end';
}

function ricFlashModal(opts={}){
  const partner=opts.partner||null; // {name, claimCode} -> registers the device MAC to the partner after flashing
  const hasSerial = !!navigator.serial;
  let phase='idle'; let port=null;
  const m=modal(`<div class="modalhead"><div><h2>Flash device</h2><p class="dim" style="font-size:12px;margin-top:4px" id="ricFlashVer">ESP32-2432S028R only · not ESP32-S3 / ES3C28P</p></div><button class="xbtn">✕</button></div>
    ${hasSerial?`

  api('/api/posbox/firmware/manifest').then(fw=>{const el=m.querySelector('#ricFlashVer');if(el&&fw.version)el.innerHTML=`Firmware <b>v${esc(fw.version)}</b> · ${(fw.bytes/1024/1024).toFixed(1)} MB · ${esc(fw.note||'')}`;}).catch(()=>{});

    try{
      port=await navigator.serial.requestPort();
      setStep(1,'done'); slot(1).innerHTML=`<span style="color:var(--ok);font-size:12.5px">Port selected</span>`;
      setStep(2,'active');
      slot(2).innerHTML=`<button class="btn teal sm" id="ricFlash">Flash firmware</button>`;
      m.querySelector('#ricFlash').onclick=async()=>{
        slot(2).innerHTML=`<div class="ricprogress"><div class="ricprogress-bar" id="ricBar" style="width:0%"></div></div><p class="dim" style="font-size:11.5px;margin-top:6px" id="ricPct">0% written</p>`;
        setStep(3,'active'); slot(3).innerHTML=`<span class="dim" style="font-size:12.5px">Preparing…</span>`;
        try{
          const mod=await import('/media/esptool-0.6.0.mjs');
          const transport=new mod.Transport(port,true);
          const loader=new mod.ESPLoader({transport,baudrate:115200,terminal:{clean:()=>{},writeLine:()=>{},write:()=>{}},enableTracing:false});
          const manifest=await api('/api/posbox/firmware/manifest');
          await loader.main();
          const chip=loader.chip?.CHIP_NAME||'';
          if(chip!==manifest.chip)throw Error('This image is for '+manifest.chip+'. Detected '+(chip||'unknown chip')+'. Nothing was written.');
          let devMac='';
          try{ devMac=String(await loader.chip.readMac(loader)).toUpperCase(); }catch{}
          const fwRes=await fetch(manifest.url);
          if(!fwRes.ok)throw Error('Failed to download firmware');
          const data=new Uint8Array(await fwRes.arrayBuffer());
          const digest=[...new Uint8Array(await crypto.subtle.digest('SHA-256',data))].map(b=>b.toString(16).padStart(2,'0')).join('');
          if(digest!==manifest.sha256 || data.length!==manifest.bytes)throw Error('Firmware verification failed. Nothing was written.');
          await loader.writeFlash({fileArray:[{data,address:manifest.address}],flashSize:'keep',flashMode:'keep',flashFreq:'keep',eraseAll:false,compress:true,
            reportProgress:(_i,written,total)=>{ const pct=total>0?Math.round(written/total*100):0; const bar=m.querySelector('#ricBar'); if(bar)bar.style.width=pct+'%'; const p=m.querySelector('#ricPct'); if(p)p.textContent=pct+'% written'; }});
          try{await loader.softReset(false);}catch{/* esptool-js cannot soft-reset ESP32; device boots on power cycle */}
          setStep(2,'done'); slot(2).innerHTML=`<span style="color:var(--ok);font-size:12.5px">v${esc(manifest.version||'?')} written${chip?' · '+esc(chip)+' detected':''}</span>`;

              m.querySelector('#ricReg').onclick=()=>{const inp=m.querySelector('#ricMac');const v=(inp?inp.value:'').trim().toUpperCase();if(!/^([0-9A-F]{2}:){5}[0-9A-F]{2}$/.test(v)){toast('Enter a valid device MAC');return}doReg(v)};
            };
            const doReg=async(macValue)=>{
              const btn=m.querySelector('#ricReg'); if(btn){btn.disabled=true;btn.textContent='Registering…'}
              try{
                if(!/^([0-9A-F]{2}:){5}[0-9A-F]{2}$/.test(macValue))throw Error('Device MAC unavailable');
                const r=await fetch('/api/posbox/devices',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({mac:macValue,claimCode:partner.claimCode})});
                const d=await r.json().catch(()=>({}));
                if(!r.ok)throw Error(d.error||'Registration failed');
                setStep(3,'done'); slot(3).innerHTML=doneMsg(!!d.replayed);
              }catch(e2){

                regPanel('Registration failed: '+(e2.message||'unknown error')+'. Retry or enter the MAC below.',macValue);
              }
            };
            if(devMac){ slot(3).innerHTML=`<span class="dim" style="font-size:12.5px">Registering device ${esc(devMac)}…</span>`; doReg(devMac); }
            else regPanel('Firmware installed, but the device MAC could not be read automatically. Enter it below to register this RIC.',null);
          } else {
          setStep(3,'done'); slot(3).innerHTML=`<p style="color:var(--ok);font-size:12.5px;font-weight:590">Firmware v${esc(manifest.version||'')} installed</p><p class="dim" style="font-size:11.5px;margin-top:4px">Power-cycle the device (unplug/replug USB), then use "Link device" to connect it to your account over Bluetooth.</p>`;
          }
        }catch(e){ setStep(3,'error'); slot(3).innerHTML=`<p style="color:var(--err);font-size:12.5px">${esc(e.message||'Flash failed')}</p><button class="btn ghost sm" id="ricRetryFlash" style="margin-top:8px">Try again</button>`; m.querySelector('#ricRetryFlash').onclick=()=>{m.remove();ricFlashModal();}; }
      };
    }catch(e){
      if(e && e.name==='NotFoundError'){ slot(1).innerHTML=`<button class="btn teal sm" id="ricConnect2">Connect to device</button>`; m.querySelector('#ricConnect2').onclick=()=>{m.remove();ricFlashModal();}; return; }
      setStep(1,'error'); slot(1).innerHTML=`<p style="color:var(--err);font-size:12.5px">${esc(e.message||'Failed to open port')}</p><button class="btn ghost sm" id="ricRetryConn" style="margin-top:8px">Try again</button>`;
      m.querySelector('#ricRetryConn').onclick=()=>{m.remove();ricFlashModal();};
    }
  };
}

function ricLinkModal(){
  const hasBluetooth = !!navigator.bluetooth;
  const isIOS=/ipad|iphone|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  let gatt=null, device=null, deviceName=null;
  const m=modal(`<div class="modalhead"><div><h2>Link device</h2><p class="dim" style="font-size:12px;margin-top:4px">Pair via Bluetooth</p></div><button class="xbtn">✕</button></div>
    ${hasBluetooth?`
      <div class="ricsteps">
        ${ricStepRow(1,'Connect','active')}
        ${ricStepRow(2,'WiFi credentials','pending')}
        ${ricStepRow(3,'Result','pending')}
      </div>
    `:`<div class="warnbox">${isIOS?'Bluetooth device linking is not supported on iPhone or iPad. Apple blocks Web Bluetooth on all iOS browsers. Use a laptop or desktop running Chrome or Edge.':'Web Bluetooth is not available in this browser. Open this page in Chrome or Edge on a laptop or desktop.'}</div>`}`);
  if(!hasBluetooth)return;
  const slot=n=>m.querySelector('#ricStepSlot'+n);
  const setStep=(n,state)=>{ m.querySelectorAll('.ricstep')[n-1].className='ricstep '+state; if(state==='done')m.querySelectorAll('.ricstep')[n-1].querySelector('.ricstep-n').textContent='✓'; };
  slot(1).innerHTML=`<button class="btn teal sm" id="ricScan">Scan for nearby device</button>`;
  m.querySelector('#ricScan').onclick=async()=>{
    slot(1).innerHTML=`<span class="dim" style="font-size:12.5px">Scanning…</span>`;
    try{
      device=await navigator.bluetooth.requestDevice({filters:[{name:'posBOX'},{namePrefix:'RIC'}],optionalServices:[RIC_BLE_SERVICE_UUID]});// posBOX: legacy firmware. RIC (1.0.2-1.0.7) and RIC-XXXX (1.0.8+, unique per unit, shown on the device screen)
      if(!device.gatt)throw Error('Device has no GATT server');
      gatt=await device.gatt.connect();
      deviceName=device.name||'RIC';
      setStep(1,'done'); slot(1).innerHTML=`<span style="color:var(--ok);font-size:12.5px">${esc(deviceName)} found</span>`;
      setStep(2,'active');
      slot(2).innerHTML=`
        <div class="ricform">
          <input class="input" id="ricSsid" placeholder="Network name (SSID)">
          <input class="input" type="password" id="ricPass" placeholder="Password" style="margin-top:8px">
          <button class="btn teal sm" id="ricProvision" style="margin-top:10px" disabled>Provision device</button>
        </div>`;
      const ssidEl=m.querySelector('#ricSsid'), passEl=m.querySelector('#ricPass'), provBtn=m.querySelector('#ricProvision');
      ssidEl.oninput=()=>{ provBtn.disabled=!ssidEl.value.trim(); };
      provBtn.onclick=async()=>{
        setStep(2,'done'); slot(2).innerHTML=`<span style="color:var(--ok);font-size:12.5px">Credentials ready</span>`;
        setStep(3,'active'); slot(3).innerHTML=`<span class="dim" style="font-size:12.5px" id="ricProvStatus">Sending credentials…</span>`;
        const statusEl=()=>m.querySelector('#ricProvStatus');
        let issuedTokenId=null, tokenWritten=false, deviceConfirmed=false;
        try{
          const service=await gatt.getPrimaryService(RIC_BLE_SERVICE_UUID);
          const [cSsid,cPass,cToken,cUrl,cCurrency,cStatus]=await Promise.all([
            service.getCharacteristic(RIC_CHAR_SSID_UUID),service.getCharacteristic(RIC_CHAR_PASS_UUID),
            service.getCharacteristic(RIC_CHAR_TOKEN_UUID),service.getCharacteristic(RIC_CHAR_URL_UUID),
            service.getCharacteristic(RIC_CHAR_CURRENCY_UUID),service.getCharacteristic(RIC_CHAR_STATUS_UUID)]);
          const currency=(await api('/api/account/settings').catch(()=>({currency:'usd'}))).currency||'usd';
          const serverUrl=location.origin+'/api';
          if(statusEl())statusEl().textContent='Issuing device token...';
          const tokenResp=await api('/api/accounts/'+RIC_ACCOUNT_ID+'/device-tokens',{method:'POST',body:JSON.stringify({label:deviceName||'RIC'})});
          issuedTokenId=tokenResp.id;
          if(statusEl())statusEl().textContent='Waiting for device to connect...';
          await cStatus.startNotifications();
          await new Promise((resolve,reject)=>{
            let settled=false;
            const settle=fn=>{ if(settled)return; settled=true; clearTimeout(timeout); device.removeEventListener('gattserverdisconnected',onDisconnect); fn(); };
            const timeout=setTimeout(()=>settle(()=>{ tokenWritten?resolve():reject(Error('Timed out. Credentials not written to device')); }),45000);
            const onDisconnect=()=>settle(()=>{ tokenWritten?resolve():reject(Error('Device disconnected before provisioning completed')); });
            device.addEventListener('gattserverdisconnected',onDisconnect);
            cStatus.addEventListener('characteristicvaluechanged',ev=>{
              const dv=ev.target.value||new DataView(new ArrayBuffer(0));
              const raw=new TextDecoder('utf-8',{fatal:false}).decode(dv);
              const val=raw.replace(/\0.*$/,'').replace(/[^\x20-\x7E]/g,'').trim();
              if(val && statusEl())statusEl().textContent=val;
              if(val==='connected'){ deviceConfirmed=true;settle(()=>resolve()); }
              else if(val.startsWith('error:')){ settle(()=>reject(Error(val.slice(6)||'Device reported an error'))); }
            });
            (async()=>{
              try{
                if(statusEl())statusEl().textContent='Writing to device...';
                await cSsid.writeValueWithoutResponse(ricEncode(ssidEl.value));
                await cPass.writeValueWithoutResponse(ricEncode(passEl.value));
                await cToken.writeValueWithoutResponse(ricEncode(tokenResp.token));
                tokenWritten=true;
                await cUrl.writeValueWithoutResponse(ricEncode(serverUrl));
                await cCurrency.writeValueWithoutResponse(ricEncode(currency));
                if(statusEl())statusEl().textContent='Waiting for device to connect...';
              }catch(e){ settle(()=>reject(e)); }
            })();
          });
          // The device restarts the moment it stores the credentials, so the
          // BLE "connected" notify usually never arrives. The real proof is the
          // token's first authenticated call: poll for it and turn the step
          // green the second it lands, instead of leaving the user guessing.
          const tokenSeen=async()=>{ try{ const seen=await api('/api/accounts/'+RIC_ACCOUNT_ID+'/device-tokens'); return seen.some(d=>d.id===issuedTokenId && d.lastUsedAt); }catch{ return false; } };
          const showConnected=()=>{ setStep(3,'done'); slot(3).innerHTML=`<div style="display:flex;align-items:center;gap:10px"><span style="display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--ok);color:#052e16;align-items:center;justify-content:center;font-weight:700;font-size:16px">✓</span><div><p style="color:var(--ok);font-size:13px;font-weight:590;margin:0">RIC linked to your account</p><p class="hint" style="margin:2px 0 0">${esc(deviceName||'RIC')} is on WiFi and authenticated with openLN. It is ready to take payments.</p></div></div>`; renderRicDevices(); };
          if(deviceConfirmed || await tokenSeen()){ showConnected(); }
          else {
            slot(3).innerHTML=`<p class="muted" style="font-size:13px;font-weight:590"><span class="spin" style="width:12px;height:12px;vertical-align:-2px;margin-right:6px"></span>Credentials saved · waiting for the RIC to come online</p><p class="hint" id="ricWaitHint">The device is restarting and joining WiFi. This usually takes 10 to 30 seconds.</p>`;
            renderRicDevices();
            const started=Date.now();
            const poll=setInterval(async()=>{
              if(!m.isConnected){ clearInterval(poll); return; }
              if(await tokenSeen()){ clearInterval(poll); showConnected(); return; }

            },3000);
          }
        }catch(e){
          if(issuedTokenId && !tokenWritten){ api('/api/accounts/'+RIC_ACCOUNT_ID+'/device-tokens/'+issuedTokenId,{method:'DELETE'}).catch(()=>{}); }
          setStep(3,'error'); slot(3).innerHTML=`<p style="color:var(--err);font-size:12.5px">${esc(e.message||'Provisioning failed')}</p><button class="btn ghost sm" id="ricRetryLink" style="margin-top:8px">Try again</button>`;
          m.querySelector('#ricRetryLink').onclick=()=>{m.remove();ricLinkModal();};
        }

      m.querySelector('#ricRetryScan').onclick=()=>{m.remove();ricLinkModal();};
    }
  };
}

/* ---- RATE MODIFIER HELPERS ---- */
// Stored form is "<CUR>*<multiplier>" (for example THB*1.02). The steppers work
// in percent of the resulting sats-per-unit rate: +2% <=> multiplier 1/1.02.
function rateModifierPct(mod){
  if(!mod) return null;
  const m=String(mod).replace(/\s/g,'').match(/^[a-z]{3,5}\*(\d+(?:\.\d+)?)$/i);
  if(!m) return NaN;
  const mult=parseFloat(m[1]);
  return mult>0?(1/mult-1)*100:NaN;
}
function ratePctModifier(pct,currency){
  if(!pct) return '';
  const cur=String(currency||'').toLowerCase();
  const code=(/^[a-z]{3,5}$/.test(cur)?cur:'usd').toUpperCase();
  return code+'*'+String(Number((1/(1+pct/100)).toFixed(6)));
}
function ratePctLabel(pct){
  const p=Math.round(pct*10)/10;
  return (p>0?'+':p<0?'\u2212':'')+Math.abs(p).toFixed(1)+'%';
}
function rateModifierLabel(mod){
  const pct=rateModifierPct(mod);
  if(pct===null) return 'Market rate';
  if(Number.isNaN(pct)) return String(mod);
  return ratePctLabel(pct);
}
/* ---- END RATE MODIFIER HELPERS ---- */
