<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>openLN — Wallet</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><style>
:root{--bg:#071616;--surface:#0d2424;--surface2:#123333;--line:#214545;--text:#f4f6f5;--muted:#94b0ad;--teal:#0e8388;--gold:#ffcc00;--danger:#ef7777}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% -10%,#164b4b 0,#071616 48%);color:var(--text);font:14px Inter,system-ui,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer;border:0}.shell{max-width:1240px;margin:auto;padding:22px 30px 50px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:42px}.brand{font-size:21px;font-weight:700;letter-spacing:-.06em}.brand i{color:var(--teal);font-style:normal}.topnav{display:flex;gap:25px;align-items:center;color:var(--muted)}.topnav a{color:inherit;text-decoration:none}.topnav .active{color:var(--text)}.avatar{border:1px solid var(--line);border-radius:50%;width:34px;height:34px;text-align:center;padding-top:8px;color:var(--gold);font-family:monospace}.eyebrow{color:var(--muted);text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:600}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:23px}.hero h1{font-size:35px;letter-spacing:-.05em;margin:8px 0 0}.wallet-state{color:var(--muted)}.wallet-state b{display:inline-block;width:7px;height:7px;background:var(--gold);border-radius:50%;margin-right:7px}.balance{background:linear-gradient(135deg,#103b3b,#0b2727);border:1px solid #286060;border-radius:18px;padding:29px 32px;margin-bottom:18px;position:relative;overflow:hidden}.balance:after{content:'';position:absolute;width:280px;height:280px;border:1px solid #286060;border-radius:50%;right:-80px;top:-140px;opacity:.35}.balance .value{font:700 46px 'JetBrains Mono',monospace;letter-spacing:-.07em;margin:12px 0 2px}.balance .unit{font-size:15px;font-weight:500;color:var(--muted)}.balance .fiat{color:var(--muted);font-family:monospace}.actions{display:flex;gap:10px;margin-top:22px}.btn{border-radius:9px;padding:11px 17px;font-weight:600;background:var(--teal);color:white}.btn.gold{background:var(--gold);color:#142020}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}.grid{display:grid;grid-template-columns:1.35fr .85fr;gap:18px}.card{background:rgba(13,36,36,.86);border:1px solid var(--line);border-radius:15px;padding:22px}.card h2{font-size:16px;margin:0 0 19px;letter-spacing:-.02em}.row{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-top:1px solid #193838}.row:first-of-type{border-top:0}.txname{font-weight:600}.txmeta{font:12px monospace;color:var(--muted);margin-top:4px}.positive{color:#72d3a7}.plugin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.plugin{border:1px solid var(--line);border-radius:11px;padding:15px;background:#0b2020}.plugin small{color:var(--muted);display:block;margin-top:6px;line-height:1.4}.plugin .tag{color:var(--gold);font:10px monospace;text-transform:uppercase;letter-spacing:.1em}.connect{max-width:560px;margin:110px auto}.connect h1{font-size:32px}.connect p{color:var(--muted);line-height:1.6}.connect form{display:flex;gap:8px;margin-top:25px}.connect input{flex:1;background:#081818;border:1px solid var(--line);border-radius:9px;color:white;padding:12px}.error{color:var(--danger);margin-top:12px}.hidden{display:none}@media(max-width:760px){.shell{padding:18px}.topnav a{display:none}.grid{grid-template-columns:1fr}.hero{display:block}.wallet-state{margin-top:15px}.balance .value{font-size:35px}.plugin-grid{grid-template-columns:1fr}.connect form{display:block}.connect input,.connect button{width:100%;margin-bottom:9px}}
</style></head><body><div id="root"></div><script>
const root=document.querySelector('#root'); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){opts.headers={...(opts.headers||{}),...(localStorage.getItem('openln_token')?{Authorization:'Bearer '+localStorage.getItem('openln_token')}:{})};const r=await fetch(path,{credentials:'include',...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
function connect(){root.innerHTML=`<main class="shell"><section class="connect"><div class="brand">open<i>LN</i></div><p class="eyebrow">Wallet core</p><h1>Your wallet. Your keys.</h1><p>Connect your own Nostr Wallet Connect wallet. openLN never takes custody of your sats.</p><form id="login"><input name="handle" placeholder="Handle" required><input name="password" type="password" placeholder="Password" required><button class="btn gold">Enter wallet</button></form><p id="err" class="error"></p><p style="color:var(--muted);font-size:12px">New here? Register with the same form.</p></section></main>`;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{const session=await api('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});localStorage.setItem('openln_token',session.token);render()}catch(x){try{const session=await api('/api/auth/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});localStorage.setItem('openln_token',session.token);render()}catch(y){document.querySelector('#err').textContent=y.message}}}}
async function render(){try{const [s,p,b]=await Promise.all([api('/api/wallet/status'),api('/api/plugins'),api('/api/wallet/balance')]);const plugins=(p||[]).filter(x=>x.uiSlots?.includes('dashboard'));root.innerHTML=`<main class="shell"><header class="topbar"><div class="brand">open<i>LN</i></div><nav class="topnav"><a class="active" href="#">Wallet</a><a href="#extensions">Extensions</a><a href="#settings">Settings</a><div class="avatar">K</div></nav></header><section class="hero"><div><div class="eyebrow">Wallet core / overview</div><h1>Good to see you.</h1></div><div class="wallet-state"><b></b>${s.connected?'NWC wallet connected':'Wallet not connected'}</div></section><section class="balance"><div class="eyebrow">Available balance</div><div class="value">${Number(b.balanceSats||0).toLocaleString()} <span class="unit">sats</span></div><div class="fiat">Source: connected wallet · live balance</div><div class="actions"><button class="btn gold">Receive</button><button class="btn ghost">Send</button></div></section><div class="grid"><section class="card"><h2>Activity <span style="color:var(--muted);font-size:12px;font-weight:400">· latest wallet events</span></h2><div class="row"><div><div class="txname">Wallet ready</div><div class="txmeta">NWC connection verified</div></div><div class="positive">●</div></div><div class="row"><div><div class="txname">No recent payments</div><div class="txmeta">Your payment history will appear here</div></div><div style="color:var(--muted)">—</div></div></section><section class="card" id="extensions"><h2>Extensions</h2><div class="plugin-grid">${plugins.map(x=>`<div class="plugin"><span class="tag">Plugin</span><div style="margin-top:8px;font-weight:600">${esc(x.id)}</div><small>Available from your wallet workspace</small></div>`).join('')}</div></section></div></main>`}catch(e){connect()}}
render();
</script></body></html>
