<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>openLN — Wallet</title><style>
:root{--bg:#071616;--surface:#0d2424;--surface2:#123333;--line:#214545;--text:#f4f6f5;--muted:#94b0ad;--teal:#0e8388;--gold:#ffcc00;--danger:#ef7777;--ok:#72d3a7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% -10%,#164b4b,#071616 48%);color:var(--text);font:14px Inter,system-ui,sans-serif;min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.shell{max-width:1240px;margin:auto;padding:22px 30px 50px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:35px}.brand{font-size:21px;font-weight:700;letter-spacing:-.06em}.brand i{color:var(--teal);font-style:normal}.topnav{display:flex;gap:20px;align-items:center;color:var(--muted);flex-wrap:wrap}.topnav a{color:inherit;text-decoration:none}.topnav .active{color:var(--text)}.avatar{border:1px solid var(--line);border-radius:50%;width:34px;height:34px;text-align:center;padding-top:8px;color:var(--gold);font-family:monospace}.eyebrow{color:var(--muted);text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:600}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:23px}.hero h1{font-size:35px;letter-spacing:-.05em;margin:8px 0 0}.wallet-state{color:var(--muted)}.wallet-state b{display:inline-block;width:7px;height:7px;background:var(--gold);border-radius:50%;margin-right:7px}.balance{background:linear-gradient(135deg,#103b3b,#0b2727);border:1px solid #286060;border-radius:18px;padding:29px 32px;margin-bottom:18px}.value{font:700 46px 'JetBrains Mono',monospace;letter-spacing:-.07em;margin:12px 0 2px}.unit{font-size:15px;font-weight:500;color:var(--muted)}.fiat,.muted{color:var(--muted)}.actions{display:flex;gap:10px;margin-top:22px}.btn{border-radius:9px;padding:11px 17px;font-weight:600;background:var(--teal);color:white}.btn.gold{background:var(--gold);color:#142020}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}.btn.danger{background:#642d35}.grid{display:grid;grid-template-columns:1.35fr .85fr;gap:18px}.card{background:rgba(13,36,36,.86);border:1px solid var(--line);border-radius:15px;padding:22px}.card h2{font-size:16px;margin:0 0 19px}.row{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-top:1px solid #193838;gap:12px}.row:first-of-type{border-top:0}.txname{font-weight:600}.txmeta{font:12px monospace;color:var(--muted);margin-top:4px}.positive{color:var(--ok)}.plugin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.plugin{border:1px solid var(--line);border-radius:11px;padding:15px;background:#0b2020}.plugin small{color:var(--muted);display:block;margin-top:6px;line-height:1.4}.plugin .tag{color:var(--gold);font:10px monospace;text-transform:uppercase}.connect{max-width:560px;margin:110px auto}.connect h1{font-size:32px}.connect p{color:var(--muted);line-height:1.6}.form{display:grid;gap:10px}.input{width:100%;background:#081818;border:1px solid var(--line);border-radius:9px;color:white;padding:12px}.error{color:var(--danger);margin-top:12px}.hidden{display:none}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px;z-index:3}.modalbox{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:25px;width:min(520px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{background:none;color:var(--muted);font-size:24px}.qr{background:#fff;color:#111;padding:15px;margin:20px auto;width:min(320px,100%);word-break:break-all;font:12px monospace;text-align:center}.pill{display:inline-block;border-radius:99px;padding:4px 9px;background:var(--surface2);color:var(--muted);font-size:12px}.toast{position:fixed;bottom:20px;right:20px;background:var(--surface2);border:1px solid var(--line);padding:14px;border-radius:9px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 7px;border-bottom:1px solid var(--line);font-size:13px}.section{margin-top:18px}.section h2{margin-top:0}@media(max-width:760px){.shell{padding:18px}.topnav a{display:none}.grid{grid-template-columns:1fr}.hero{display:block}.wallet-state{margin-top:15px}.value{font-size:35px}.plugin-grid{grid-template-columns:1fr}.table{display:block;overflow:auto;white-space:nowrap}}
</style></head><body><div id="root"></div><script>
const root=document.querySelector('#root'), token=()=>localStorage.getItem('openln_token'); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){opts.headers={...(opts.headers||{}),...(token()?{Authorization:'Bearer '+token()}:{})};const r=await fetch(path,{credentials:'include',...opts});const d=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem('openln_token');connect('Session expired');throw Error('Session expired')}if(!r.ok)throw Error(d.error||'Request failed');return d}
function connect(msg=''){root.innerHTML=`<main class="shell"><section class="connect"><div class="brand">open<i>LN</i></div><p class="eyebrow">Wallet core</p><h1>Your wallet. Your keys.</h1><p>Connect your own Nostr Wallet Connect wallet. openLN never takes custody of your sats.</p><form id="login" class="form"><input class="input" name="handle" placeholder="Handle" required><input class="input" name="password" type="password" placeholder="Password" required><button class="btn gold">Enter wallet</button></form><p id="err" class="error">${esc(msg)}</p><p class="muted" style="font-size:12px">New here? Register with the same form.</p></section></main>`;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();let body=Object.fromEntries(new FormData(e.target));try{let s=await api('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});localStorage.setItem('openln_token',s.token);render()}catch(x){try{let s=await api('/api/auth/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});localStorage.setItem('openln_token',s.token);render()}catch(y){document.querySelector('#err').textContent=y.message}}}}}
function modal(title,body){let el=document.createElement('div');el.className='modal';el.innerHTML=`<div class="modalbox"><div class="modalhead"><h2>${title}</h2><button class="close">×</button></div>${body}</div>`;root.append(el);el.querySelector('.close').onclick=()=>el.remove();return el}
function receive(){let m=modal('Receive sats',`<form id="receive" class="form"><label class="muted">Amount (sats)<input class="input" name="amountSats" type="number" min="1" required autofocus></label><input class="input" name="memo" placeholder="Memo (optional)"><input class="input" name="deviceId" placeholder="POSBOX device ID (optional)"><button class="btn gold">Create invoice</button></form><div id="result"></div>`);m.querySelector('form').onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));v.amountSats=Number(v.amountSats);if(!v.deviceId)delete v.deviceId;try{let d=await api('/api/pos/invoice',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(v)});m.querySelector('#result').innerHTML=`<div class="qr">LIGHTNING INVOICE<br><br>${esc(d.bolt11)}</div><p class="muted">Waiting for settlement… fee is calculated after payment.</p>`;let timer=setInterval(async()=>{try{let s=await api('/api/payments/'+encodeURIComponent(d.paymentHash)+'/status');if(s.status==='paid'||s.status==='settled'){clearInterval(timer);m.querySelector('#result').innerHTML+=`<p class="positive">Payment settled · fee ${s.feeSats||0} sats</p>`}}catch{clearInterval(timer)}},2000)}catch(x){m.querySelector('#result').innerHTML=`<p class="error">${esc(x.message)}</p>`}}}
function send(){let m=modal('Send sats',`<form id="send" class="form"><textarea class="input" name="bolt11" rows="4" placeholder="Paste BOLT11 invoice" required></textarea><button class="btn">Verify invoice</button></form><div id="result"></div>`);m.querySelector('form').onsubmit=async e=>{e.preventDefault();let bolt11=new FormData(e.target).get('bolt11').trim();m.querySelector('#result').innerHTML='<p class="muted">Decoding invoice…</p>';try{let d=await api('/api/wallet/verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({bolt11})});m.querySelector('#result').innerHTML=`<p>Pay <b>${Number(d.amountSats).toLocaleString()} sats</b>${d.description?' · '+esc(d.description):''}?</p><button id="pay" class="btn gold">Confirm payment</button>`;m.querySelector('#pay').onclick=async()=>{m.querySelector('#result').innerHTML='<p class="muted">Sending… do not retry if this takes time.</p>';try{let p=await api('/api/wallet/pay',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({bolt11})});m.querySelector('#result').innerHTML=`<p class="positive">Payment complete · ${esc(p.paymentHash||'recorded')}</p>`}catch(x){m.querySelector('#result').innerHTML=`<p class="error">${esc(x.message)}</p>`}}}catch(x){m.querySelector('#result').innerHTML=`<p class="error">${esc(x.message)}</p>`}}}
async function activity(){try{let d=await api('/api/reports/transactions?limit=20');return d.transactions||[]}catch{return []}}
function row(t){return `<div class="row"><div><div class="txname">${esc(t.memo|| (t.direction==='in'?'Received sats':'Sent sats'))}</div><div class="txmeta">${esc(t.createdAt||'')} · ${esc(t.status||t.wrapStatus||'unknown')}</div></div><div class="${t.direction==='in'?'positive':''}">${t.direction==='in'?'+':'−'}${Number(t.amountSats||0).toLocaleString()} sats</div></div>`}
async function render(){if(!token())return connect();try{let [s,b,p,tx]=await Promise.all([api('/api/wallet/status'),api('/api/wallet/balance'),api('/api/plugins'),activity()]);let plugins=(p||[]).filter(x=>x.uiSlots?.includes('dashboard'));root.innerHTML=`<main class="shell"><header class="topbar"><div class="brand">open<i>LN</i></div><nav class="topnav"><a class="active" href="#wallet">Wallet</a><a href="#activity">Activity</a><a href="#extensions">Extensions</a><a href="#settings">Settings</a><a href="/partner">Partner</a><div class="avatar">₿</div></nav></header><section class="hero"><div><div class="eyebrow">Wallet core / overview</div><h1>Good to see you.</h1></div><div class="wallet-state"><b></b>${s.connected?'NWC wallet connected':'Wallet not connected'}</div></section><section class="balance"><div class="eyebrow">Available balance</div><div class="value">${Number(b.balanceSats||0).toLocaleString()} <span class="unit">sats</span></div><div class="fiat">Source: connected wallet · live balance</div><div class="actions"><button id="receive" class="btn gold">Receive</button><button id="send" class="btn ghost">Send</button></div></section><div class="grid"><section class="card" id="activity"><h2>Activity <span class="muted" style="font-size:12px;font-weight:400">· latest wallet events</span></h2>${tx.length?tx.map(row).join(''):'<p class="muted">No transactions yet.</p>'}</section><section class="card" id="extensions"><h2>Extensions</h2><div class="plugin-grid">${plugins.map(x=>`<button class="plugin" data-plugin="${esc(x.id)}"><span class="tag">Plugin</span><div style="margin-top:8px;font-weight:600">${esc(x.id)}</div><small>Open extension workspace</small></button>`).join('')||'<p class="muted">No extensions enabled.</p>'}</div></section></div><section class="card section" id="settings"><h2>Wallet settings</h2><p class="muted">${s.connected?'Your NWC connection is active.':'No wallet connected.'}</p><form id="wallet" class="form"><input class="input" name="connection" placeholder="nostr+walletconnect://…"><button class="btn">Replace wallet</button></form><button id="logout" class="btn danger" style="margin-top:10px">Log out</button></section></main>`;document.querySelector('#receive').onclick=receive;document.querySelector('#send').onclick=send;document.querySelector('#logout').onclick=()=>{localStorage.removeItem('openln_token');connect()};document.querySelector('#wallet').onsubmit=async e=>{e.preventDefault();try{await api('/api/wallet/connect',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});render()}catch(x){toast(x.message)}};document.querySelectorAll('[data-plugin]').forEach(x=>x.onclick=()=>toast(x.dataset.plugin+' extension is available via its API surface.'))}catch(e){if(token())toast(e.message)}}
function toast(s){let x=document.createElement('div');x.className='toast';x.textContent=s;document.body.append(x);setTimeout(()=>x.remove(),3500)}render();
</script></body></html>
