<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>openLN — Wallet</title>
<style>
/* openLN design system v3 — Linear-precision dark + openLN teal/gold identity
   Luminance hierarchy: #080a0a canvas → rgba white surfaces. One accent pair.
   Typography: Inter (450/510/590 weights), JetBrains Mono for money. */
:root{
  --bg:#080a0a; --bg2:#0c0f0f;
  --surface:rgba(255,255,255,.025); --surface2:rgba(255,255,255,.045); --surface3:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.11);
  --text:#f2f5f4; --text2:#9aa8a5; --text3:#5f6d6a;
  --teal:#14b8a6; --teal-dim:rgba(20,184,166,.14); --teal-line:rgba(20,184,166,.35);
  --gold:#f5c518; --gold-dim:rgba(245,197,24,.12);
  --ok:#34d399; --err:#f87171;
  --r-sm:6px; --r-md:8px; --r-lg:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-feature-settings:"cv01","ss03"}
body{background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(1100px 500px at 75% -12%, rgba(20,184,166,.055), transparent 62%),
  radial-gradient(700px 400px at -10% 108%, rgba(245,197,24,.028), transparent 60%);
  pointer-events:none}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.muted{color:var(--text2)}.dim{color:var(--text3)}

/* light theme */
html.light{--bg:#f4f7f6;--bg2:#eef3f2;--surface:rgba(6,40,38,.035);--surface2:rgba(6,40,38,.06);--surface3:rgba(6,40,38,.09);--line:rgba(6,40,38,.12);--line2:rgba(6,40,38,.18);--text:#0a1a19;--text2:#435754;--text3:#748a87}
html.light body{background:var(--bg);color:var(--text)}
html.light body::before{background:radial-gradient(1100px 500px at 75% -12%, rgba(20,184,166,.08), transparent 62%),radial-gradient(700px 400px at -10% 108%, rgba(232,180,9,.06), transparent 60%)}
html.light header.top{background:rgba(244,247,246,.85);border-bottom:1px solid var(--line)}
html.light .modalbox{background:#fff;box-shadow:0 24px 70px rgba(6,40,38,.25)}
html.light .balance{background:linear-gradient(160deg, rgba(6,40,38,.05), rgba(6,40,38,.02))}
html.light .btn.gold{box-shadow:0 6px 18px rgba(232,180,9,.25)}
.themetoggle{width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);display:grid;place-items:center;cursor:pointer;font-size:14px;color:var(--text2);transition:.15s}
.themetoggle:hover{color:var(--text);border-color:var(--teal-line)}
/* shell */
.shell{max-width:1180px;margin:0 auto;padding:0 32px 90px}
header.top{position:sticky;top:0;z-index:40;background:rgba(8,10,10,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);margin:0 -32px;padding:0 32px}
.topin{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:590;letter-spacing:-.3px}.brand em{font-style:normal;color:var(--teal);margin-left:-.5px}
.brand .lnmark{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#0d3d3a,#123f3c);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
.brand .lnmark svg{display:block}
.brand em{font-style:normal;color:var(--teal)}
nav.tabs{display:none}
nav.tabs button{padding:7px 13px;border-radius:var(--r-sm);font-size:13.5px;font-weight:510;color:var(--text2);transition:.15s}
.menu-btn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:9px;color:var(--text2);font-size:19px;line-height:1;transition:.15s}
.menu-btn:hover{color:var(--text);border-color:var(--teal-line);background:var(--surface2)}
.drawer-backdrop{position:fixed;inset:0;z-index:80;background:#050a09}
.drawer{position:absolute;top:0;right:0;height:100%;width:min(330px,calc(100vw - 44px));background:#0a1211;border-left:1px solid var(--line2);padding:22px 18px;box-shadow:-30px 0 80px rgba(0,0,0,.6);animation:drawerIn .18s ease-out}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.drawer-title{font-size:14px;font-weight:590;color:var(--text2);letter-spacing:.02em}
.drawer-nav{display:grid;gap:6px}
.drawer-link{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 13px;border-radius:9px;color:var(--text2);text-align:left;font-size:14px;transition:.13s}
.drawer-link:hover,.drawer-link.on{background:var(--surface2);color:var(--text)}
.drawer-link .arrow{color:var(--text3);font-size:16px}
.drawer-divider{height:1px;background:var(--line);margin:14px 0}
@keyframes drawerIn{from{transform:translateX(18px);opacity:.5}to{transform:none;opacity:1}}
nav.tabs button:hover,nav.tabs a{padding:7px 13px;border-radius:var(--r-sm);font-size:13.5px;font-weight:510;color:var(--text2);transition:.15s}
nav.tabs button:hover,nav.tabs a:hover{color:var(--text);background:var(--surface2)}
nav.tabs button.on{color:var(--text);background:var(--surface3);box-shadow:inset 0 0 0 1px var(--line)}
.uavatar{width:30px;height:30px;border-radius:50%;background:var(--teal-dim);box-shadow:inset 0 0 0 1px var(--teal-line);display:grid;place-items:center;color:var(--teal);font-size:12px;font-weight:590}

/* type */
.overline{font-size:10.5px;font-weight:590;letter-spacing:.14em;text-transform:uppercase;color:var(--text3)}
h1.page{font-size:27px;font-weight:590;letter-spacing:-.68px;line-height:1.1;margin-top:7px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 24px}
.card+.card{margin-top:14px}
.card h3{font-size:14.5px;font-weight:590;letter-spacing:-.18px;display:flex;align-items:center;justify-content:space-between}
.card h3 .side{font-size:12px;font-weight:450;color:var(--text3)}

/* balance hero */
.balance{position:relative;overflow:hidden;border:1px solid var(--line2);background:
  radial-gradient(560px 240px at 88% -30%, rgba(20,184,166,.13), transparent 70%),
  linear-gradient(160deg, rgba(255,255,255,.045), rgba(255,255,255,.018));
  border-radius:16px;padding:30px 32px;margin:26px 0 14px}
.balance::after{content:'';position:absolute;right:-70px;top:-90px;width:300px;height:300px;border-radius:50%;border:1px solid rgba(20,184,166,.16);pointer-events:none}
.balance .blabel{display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px rgba(52,211,153,.7)}
.dot.off{background:var(--text3);box-shadow:none}
.balance .bval{font-family:'JetBrains Mono',monospace;font-size:44px;font-weight:600;letter-spacing:-1.6px;line-height:1.05;margin:14px 0 3px}
.balance .bval .cur{font-size:15px;font-weight:450;color:var(--text2);letter-spacing:0;margin-left:8px}
.balance .bsrc{font-size:12.5px;color:var(--text3)}
.bacts{display:flex;gap:9px;margin-top:24px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 17px;border-radius:var(--r-sm);font-size:13.5px;font-weight:590;letter-spacing:-.1px;transition:.15s;box-shadow:inset 0 0 0 1px transparent}
.btn.gold{background:var(--teal);color:#eaffff;box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 6px 18px rgba(14,131,136,.22)}
.btn.gold:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--surface2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.ghost:hover{background:var(--surface3)}
.btn.teal{background:var(--teal-dim);color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal-line)}
.btn.teal:hover{background:rgba(20,184,166,.2)}
.btn.danger{background:rgba(248,113,113,.09);color:var(--err);box-shadow:inset 0 0 0 1px rgba(248,113,113,.28)}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}

/* layout grid */
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-top:14px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
@media(max-width:760px){
  .shell{padding:0 16px 40px}
  header.top{margin:0 -16px;padding:0 16px}
  .topin{height:54px}
  nav.tabs button{padding:6px 10px;font-size:12.5px}
  .balance{padding:22px 20px;border-radius:14px;margin-top:18px}
  .balance .bval{font-size:34px;letter-spacing:-1.1px}
  .bacts{flex-direction:column}
  .bacts .btn{width:100%;justify-content:center;padding:12px}
  .card{padding:18px 16px;border-radius:10px}
  .grid{gap:12px;margin-top:12px}
  h1.page{font-size:22px;letter-spacing:-.5px}
  .statgrid{grid-template-columns:1fr 1fr}
  .modalbox{padding:20px 18px}
  .qrwrap img{width:200px !important;height:200px !important}
  .rowtx{padding:12px 0}
  .rowtx .t2{font-size:10.5px}
  .copyrow{flex-direction:column}
  .copyrow .btn{width:100%;justify-content:center}
  .brand span{font-size:14px}
  .uavatar{width:26px;height:26px;font-size:11px}
}

/* activity rows */
.rowtx{display:flex;align-items:center;gap:14px;padding:13px 2px;border-top:1px solid var(--line);cursor:pointer;transition:background .12s}
.rowtx:hover{background:var(--surface)}
.rowtx:first-of-type{border-top:0}
.rowtx .ico{width:34px;height:34px;border-radius:9px;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;flex-shrink:0}
.rowtx .ico.in{background:var(--teal-dim);box-shadow:inset 0 0 0 1px var(--teal-line);color:var(--teal)}
.rowtx .meta{flex:1;min-width:0}
.rowtx .t1{font-size:13.5px;font-weight:510;letter-spacing:-.12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowtx .t2{font-size:11.5px;color:var(--text3);margin-top:2px}
.rowtx .amt{font-family:'JetBrains Mono',monospace;font-size:13.5px;font-weight:500;white-space:nowrap}
.rowtx .amt.in{color:var(--ok)}
.badge{display:inline-block;font-size:10.5px;font-weight:590;padding:2.5px 8px;border-radius:999px;letter-spacing:.02em}
.badge.ok{background:rgba(52,211,153,.11);color:var(--ok)}
.badge.pend{background:var(--surface3);color:var(--text2)}
.badge.gold{background:var(--gold-dim);color:var(--gold)}

/* installed extension chips — compact, one line each */
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px 7px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:510;color:var(--text2);cursor:pointer;transition:.13s;white-space:nowrap}
.chip:hover{border-color:var(--teal-line);color:var(--text);background:var(--surface2)}
.chip .cdot{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.chip.off .cdot{background:var(--text3)}
.chipwrap{display:flex;flex-wrap:wrap;gap:7px}
/* marketplace */
.mrow{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.mrow+.mrow{margin-top:8px}
.mrow .mico{width:38px;height:38px;border-radius:10px;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;font-size:15px;flex-shrink:0}
.mrow.on{border-color:var(--teal-line)}
.mrow .mmeta{flex:1;min-width:0}
.mrow .mt1{font-size:13.5px;font-weight:590;letter-spacing:-.12px}
.mrow .mt2{font-size:12px;color:var(--text3);margin-top:2px}
.mcat{display:inline-block;font-size:10px;font-weight:590;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-left:8px}
/* extensions */
.ext{display:flex;align-items:center;gap:12px;padding:12px 13px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);transition:.15s;cursor:pointer;width:100%;text-align:left}
.ext:hover{background:var(--surface2);border-color:var(--line2)}
.ext .exico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:13px;flex-shrink:0}
.ext .exmeta{flex:1;min-width:0}
.ext .ext1{font-size:13px;font-weight:590;letter-spacing:-.1px}
.ext .ext2{font-size:11.5px;color:var(--text3);margin-top:1px}
.ext .arrow{color:var(--text3);font-size:15px}
.extgrid{display:grid;gap:8px}

/* wallet home — WoS-style: hero balance, latest tx, chevron history, bottom action bar */
.wos{display:flex;flex-direction:column;min-height:calc(100vh - 54px)}
.wos-hero{flex:0 0 auto;text-align:center;padding:52px 20px 22px}
.wos-hero .conn{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:590;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:16px}
.wos-hero .conn .dot{margin:0}
.wos-bal{font-family:'JetBrains Mono',monospace;font-size:46px;font-weight:600;letter-spacing:-1.7px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.wos-bal .cur{font-size:15px;font-weight:450;color:var(--text2);letter-spacing:0;margin-left:7px}
.wos-fiat{font-size:13px;color:var(--text3);margin-top:9px}
.wos-latest{margin:6px 14px 0}
.wos-latest .rowtx{padding:15px 4px}
.wos-hist{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:7px;margin:4px 0 12px;color:var(--text3);font-size:13.5px;font-weight:510;cursor:pointer;padding:9px 18px;border-radius:999px;transition:.14s;width:fit-content;margin-left:auto;margin-right:auto}
.wos-hist:hover{color:var(--text2);background:var(--surface)}
.wos-spacer{flex:1 1 auto}
.wos-actions{position:sticky;bottom:0;display:flex;gap:10px;padding:14px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--bg) 30%)}
.wos-actions .btn{flex:1;justify-content:center;padding:15px 10px;font-size:15.5px;border-radius:999px}
.btn.receive{background:transparent;border:1.5px solid var(--teal);color:var(--teal)}
.btn.receive:hover{background:rgba(14,131,136,.1)}
.btn.send{background:var(--teal);color:#eaffff;border:1.5px solid var(--teal)}
.btn.send:hover{background:#0f9499;filter:brightness(1.02)}
@media(max-width:760px){
  .wos-hero{padding:36px 20px 18px}
  .wos-bal{font-size:38px;letter-spacing:-1.3px}
}
/* settings page */
.setgrid{display:grid;gap:14px;max-width:640px}
.setcard{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);padding:20px}
.setcard h3{font-size:14px;font-weight:590;letter-spacing:-.1px;margin:0 0 4px}
.setcard .sub{font-size:12px;color:var(--text3);margin-bottom:16px}
.setrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0;padding-top:4px}
.setrow label{flex:1;font-size:13px;color:var(--text2)}
.setrow label small{display:block;font-size:11px;color:var(--text3);margin-top:2px}
.setrow select,.setrow input{background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:9px 11px;font-size:13px;color:var(--text);min-width:150px;font-family:inherit}
.setrow input.mono{font-family:'JetBrains Mono',monospace}
.setrow select:focus,.setrow input:focus{outline:none;border-color:var(--teal-line);box-shadow:0 0 0 3px var(--teal-dim)}
.set-actions{display:flex;gap:8px;margin-top:14px}
.walletstate{display:flex;align-items:center;gap:10px;padding:10px 0}
.walletstate .dot{width:8px;height:8px;border-radius:50%;background:var(--teal)}
.walletstate .dot.off{background:var(--err)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.formgrid{grid-template-columns:1fr}}.issued-card-list{display:grid;gap:6px}.issued-card-row{display:flex;align-items:center;gap:9px;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);text-align:left;color:var(--text);cursor:pointer}.issued-card-row:hover{border-color:var(--teal-line)}.card-mini{width:29px;height:19px;border-radius:4px;background:linear-gradient(135deg,#123f3c,#0b1f1e);display:grid;place-items:center;flex-shrink:0}.card-mini-mark{color:var(--teal);font-size:15px;line-height:1}.issued-card-meta{flex:1;min-width:0}.issued-card-meta b{display:block;font-size:12px;font-weight:590}.issued-card-meta small{display:block;color:var(--text3);font-size:10.5px;margin-top:2px}
.manage-actions{display:flex;flex-wrap:wrap;gap:7px}.manage-section{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.manage-section .label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}.manage-line{display:flex;justify-content:space-between;padding:5px 0;font-size:12px}.dangerText{color:var(--err)!important}
/* real card face — CR80 ratio 85.6x54mm ≈ 1.586:1 */
.cardface{position:relative;width:100%;max-width:340px;aspect-ratio:1.586/1;border-radius:16px;margin:0 auto;padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
  background:radial-gradient(120% 140% at 100% 0%, rgba(20,184,166,.35), transparent 55%),radial-gradient(120% 140% at 0% 100%, rgba(245,197,24,.10), transparent 50%),linear-gradient(155deg,#0e2b29 0%,#0a1917 55%,#071211 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 18px 40px -12px rgba(0,0,0,.6);color:#eafffd}
.cardface::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0px,rgba(255,255,255,.025) 1px,transparent 1px,transparent 5px);pointer-events:none}
.cardface.frozen{filter:saturate(.35) brightness(.85)}
.cardface.cancelled{filter:grayscale(1) brightness(.6)}
.cardface-top{display:flex;align-items:flex-start;justify-content:space-between;position:relative;z-index:1}
.cardface-chip{width:34px;height:25px;border-radius:5px;background:linear-gradient(155deg,#e8d38a,#b8964f);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);position:relative}
.cardface-chip::before,.cardface-chip::after{content:'';position:absolute;background:rgba(0,0,0,.22)}
.cardface-chip::before{left:50%;top:4px;bottom:4px;width:1px}
.cardface-chip::after{top:50%;left:4px;right:4px;height:1px}
.cardface-badge{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;padding:4px 9px;border-radius:20px;background:rgba(20,184,166,.18);color:#7cf5df;backdrop-filter:blur(2px)}
.cardface-badge.frozen{background:rgba(245,197,24,.18);color:var(--gold)}
.cardface-badge.cancelled{background:rgba(248,113,113,.18);color:#ffb3b3}
.cardface-mid{position:relative;z-index:1;font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.14em;color:rgba(234,255,253,.55)}
.cardface-bottom{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.cardface-name{font-size:15.5px;font-weight:590;letter-spacing:-.1px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cardface-network{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(234,255,253,.45);flex-shrink:0}
.qrbox{display:grid;place-items:center;background:#0a0f0f;border-radius:10px;padding:16px;margin-bottom:14px;min-height:252px}
.qrbox img{width:220px;height:220px;display:block}
.qrbox .dim{font-size:12px}
/* RIC */
.ricgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;max-width:520px}
.rictile{text-align:left;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:8px;transition:.15s}
.rictile:hover{border-color:var(--teal-line);transform:translateY(-1px)}
.rictile-ico{width:34px;height:34px;border-radius:9px;background:var(--teal-dim);color:var(--teal);display:grid;place-items:center;font-size:16px}
.rictile-label{font-size:14px;font-weight:590}
.rictile-sub{font-size:11.5px;color:var(--text3)}
.ricrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;max-width:640px}
.ricrow+.ricrow{margin-top:8px}
.ricrow-top{display:flex;align-items:center;gap:7px;font-size:13.5px}
.ricdot{width:7px;height:7px;border-radius:50%;background:var(--text3);opacity:.5;display:inline-block}
.ricdot.on{background:var(--ok);opacity:1}
.ricstatus{font-size:11.5px;color:var(--text3)}
.ricstatus.on{color:var(--ok)}
.ricsteps{display:flex;flex-direction:column;gap:10px}
.ricstep{display:flex;gap:12px;border:1px solid var(--line);border-radius:var(--r-md);padding:14px;background:var(--surface2);opacity:.4;transition:.15s}
.ricstep.active{opacity:1;border-color:var(--teal-line);background:var(--teal-dim)}
.ricstep.done{opacity:.7;border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.05)}
.ricstep.error{opacity:1;border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.06)}
.ricstep-n{width:22px;height:22px;border-radius:50%;background:var(--surface3);color:var(--text2);font-size:11px;font-weight:700;display:grid;place-items:center;flex-shrink:0}
.ricstep.active .ricstep-n{background:var(--teal-dim);color:var(--teal)}
.ricstep.done .ricstep-n{background:rgba(52,211,153,.18);color:var(--ok)}
.ricstep-label{font-size:13px;font-weight:590;margin-bottom:6px}
.ricprogress{height:6px;background:var(--surface3);border-radius:4px;overflow:hidden}
.ricprogress-bar{height:100%;background:var(--teal);border-radius:4px;transition:width .2s}
.warnbox{border:1px solid rgba(248,113,113,.3);background:rgba(248,113,113,.08);color:#ffb3b3;border-radius:var(--r-md);padding:13px 14px;font-size:12.5px;line-height:1.5}
.warnbox.ok{border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.08);color:var(--ok);font-weight:590}
.ricform .input{width:100%}
.ricsteps-plain{display:grid;gap:9px;padding-left:2px}
.ricsteps-plain li{list-style:none;display:flex;gap:9px;font-size:12.5px;color:var(--text2);line-height:1.4;counter-increment:ricstep}
.ricsteps-plain{counter-reset:ricstep}
.ricsteps-plain li::before{content:counter(ricstep);width:18px;height:18px;border-radius:50%;background:var(--teal-dim);color:var(--teal);font-size:10px;font-weight:700;display:grid;place-items:center;flex-shrink:0;margin-top:1px}
.backlink{font-size:12.5px;color:var(--text2);display:inline-flex;align-items:center;gap:4px;padding:6px 2px}.backlink:hover{color:var(--text)}
.cardsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.cardtile{position:relative;text-align:left;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:14px;min-height:158px;display:flex;flex-direction:column;gap:8px;transition:.15s}
.cardtile:hover{border-color:var(--teal-line);transform:translateY(-1px)}
.cardtile.frozen{}
.cardtile.cancelled{opacity:.55}
.cardtile.new{align-items:center;justify-content:center;background:var(--surface);border-style:dashed;border-color:var(--line2);gap:8px}
.cardtile-plus{font-size:22px;color:var(--teal);line-height:1}
.cardtile-label{font-size:12.5px;color:var(--text2);font-weight:510}
.cardtile-face{position:relative;height:66px;border-radius:9px;padding:10px 11px;display:flex;align-items:flex-start;justify-content:space-between;overflow:hidden;
  background:radial-gradient(130% 160% at 100% 0%, rgba(20,184,166,.32), transparent 55%),linear-gradient(155deg,#0e2b29 0%,#0a1917 55%,#071211 100%)}
.cardtile.frozen .cardtile-face{filter:saturate(.35) brightness(.85)}
.cardtile.cancelled .cardtile-face{filter:grayscale(1) brightness(.6)}
.cardtile-chip{width:20px;height:15px;border-radius:3px;background:linear-gradient(155deg,#e8d38a,#b8964f)}
.cardtile-badge{font-size:9px;text-transform:uppercase;letter-spacing:.07em;padding:3px 7px;border-radius:20px;background:rgba(20,184,166,.18);color:#7cf5df;height:fit-content}
.cardtile-badge.frozen{background:rgba(245,197,24,.18);color:var(--gold)}
.cardtile-badge.cancelled{background:rgba(248,113,113,.18);color:#ffb3b3}
.cardtile-name{font-size:14px;font-weight:590;letter-spacing:-.1px;margin-top:2px}
.cardtile-meta{font-size:11px;color:var(--text3)}
@media(max-width:640px){.cardsgrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}

/* money input */
.amtfield{position:relative;margin:4px 0 2px}
.amtfield input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 56px 16px 16px;font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:600;letter-spacing:-.8px;color:var(--text);text-align:center;transition:.15s}
.amtfield input:focus{outline:none;border-color:var(--teal-line);background:var(--surface2);box-shadow:0 0 0 3px rgba(20,184,166,.1)}
.amtfield input::placeholder{color:var(--text3);font-weight:450}
.amtfield .suffix{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--text3);font-weight:510}
.amtchips{display:flex;gap:7px;margin-top:10px}
.amtchips button{flex:1;padding:7px 4px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:590;color:var(--text2);transition:.12s}
.amtchips button:hover{color:var(--text);border-color:var(--line2);background:var(--surface2)}
/* forms */
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:12px;font-weight:510;color:var(--text2);margin-bottom:6px}
.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 13px;font-size:14px;color:var(--text);transition:.15s}
.input:focus{outline:none;border-color:var(--teal-line);background:var(--surface2)}
.input.mono{font-family:'JetBrains Mono',monospace;font-size:12.5px}

/* modal */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(2,4,4,.72);backdrop-filter:blur(6px)}
.modalbox{width:min(500px,calc(100vw - 40px));max-height:calc(100vh - 60px);overflow:auto;background:#0d1111;border:1px solid var(--line2);border-radius:16px;padding:26px 26px 24px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modalhead h2{font-size:16.5px;font-weight:590;letter-spacing:-.24px}
.xbtn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--text3);background:var(--surface2)}
.xbtn:hover{color:var(--text)}

/* invoice QR */
.qrwrap{display:grid;place-items:center;padding:20px 0 6px}
.qrwrap svg{border-radius:14px;box-shadow:inset 0 0 0 1px var(--line2)}
.invstatus{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:14px;padding:12px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:510}
.invstatus.paid{background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.3);color:var(--ok)}
.invstatus.wait{color:var(--text2)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:pl 1.4s infinite}
.pulse.ok{background:var(--ok);animation:none}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.3}}
.copyrow{display:flex;gap:8px;margin-top:12px}
.copyrow .input{flex:1;font-size:11px}

/* toast */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:200;background:#101616;border:1px solid var(--line2);color:var(--text);border-radius:10px;padding:11px 18px;font-size:13px;font-weight:510;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(8px)}}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.loginbox{width:min(400px,100%);text-align:left}
.loginbox .lg{display:flex;align-items:center;gap:11px;margin-bottom:34px}
.loginbox h1{font-size:25px;font-weight:590;letter-spacing:-.62px;line-height:1.12}
.loginbox .sub{color:var(--text2);margin:10px 0 26px;font-size:14px;line-height:1.6}
.hint{font-size:12px;color:var(--text3);margin-top:14px}

/* partner */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:2px}
@media(max-width:700px){.statgrid{grid-template-columns:1fr}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:15px 16px}
.stat .sv{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600;letter-spacing:-.8px;margin-top:6px}
.stat .sv.g{color:var(--gold)}.stat .sv.t{color:var(--teal)}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th{text-align:left;font-size:11px;font-weight:590;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);padding:8px 10px;border-bottom:1px solid var(--line)}
table.tb td{padding:10px;border-bottom:1px solid var(--line)}
table.tb tr:last-child td{border-bottom:0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--text3);border-top-color:var(--teal);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
/* admin treasury console */
.admgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:14px}
.admstat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 13px}
.admstat .lbl{font-size:9.5px;font-weight:590;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.admstat .val{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:600;letter-spacing:-.5px;margin-top:5px;color:var(--text)}
.admstat .val.g{color:var(--ok)}.admstat .val.a{color:var(--gold)}.admstat .val.r{color:var(--err)}
.admstat .sub{font-size:10.5px;color:var(--text3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.admrow{display:grid;grid-template-columns:76px 92px 1fr 130px 84px 70px;gap:8px;align-items:center;padding:10px 10px;border-top:1px solid var(--line);cursor:pointer;transition:background .12s;text-align:left;width:100%}
.admrow:first-of-type{border-top:0}
.admrow:hover{background:var(--surface)}
.admrow .k{font-family:'JetBrains Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3)}
@media(max-width:820px){.admrow{grid-template-columns:1fr 1fr;grid-auto-rows:auto}}
.admpill{display:inline-block;font-size:9.5px;font-weight:590;padding:2.5px 8px;border-radius:999px;letter-spacing:.02em;border:1px solid transparent}
.admpill.slate{background:var(--surface3);color:var(--text2)}
.admpill.blue{background:rgba(56,142,229,.14);color:#7db8f0;border-color:rgba(56,142,229,.3)}
.admpill.amber{background:var(--gold-dim);color:var(--gold);border-color:rgba(245,197,24,.3)}
.admpill.violet{background:rgba(167,139,250,.14);color:#c4b3fb;border-color:rgba(167,139,250,.3)}
.admpill.green{background:rgba(52,211,153,.12);color:var(--ok);border-color:rgba(52,211,153,.3)}
.admpill.red{background:rgba(248,113,113,.12);color:var(--err);border-color:rgba(248,113,113,.3)}
.admpill.rose{background:rgba(248,113,113,.18);color:#ffb3c4;border-color:rgba(248,113,113,.35)}
.admfilters{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px}
.admfilters .input{flex:1;min-width:180px}
.admfilters select{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;font-size:12.5px;color:var(--text);font-family:inherit}
.admtimeline{display:flex;flex-direction:column;gap:0}
.admtl-item{display:flex;gap:10px;padding-bottom:12px}
.admtl-item:last-child{padding-bottom:0}
.admtl-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;background:var(--text3)}
.admtl-dot.success{background:var(--ok)}.admtl-dot.fail{background:var(--err)}.admtl-dot.ambiguous{background:var(--gold)}.admtl-dot.pending{background:#e8c542}
.admtl-line{width:1px;flex:1;background:var(--line);margin:2px 0 0 3.5px}
.admtl-body{min-width:0;flex:1}
.admtl-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text3)}
.admtl-msg{font-size:12.5px;color:var(--text);margin-top:2px}
.admtl-err{font-size:10.5px;color:var(--err);font-family:'JetBrains Mono',monospace;margin-top:2px}
.admactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.admlegs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.admleg{font-size:10.5px;font-family:'JetBrains Mono',monospace;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface2)}
.admkv{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:12px}
.admkv .k{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3)}
.admkv .v{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--text);margin-top:2px;overflow-wrap:anywhere}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;510;590;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head><body><div id="root"></div>
<script>
const $=document.querySelector.bind(document),root=$('#root');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tok=()=>localStorage.getItem('openln_token');
const fmt=n=>Number(n||0).toLocaleString('en-US');
const ago=t=>{const s=(Date.now()-new Date(t))/1e3;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'};
const MARK=`<span class="lnmark"><svg width="17" height="17" viewBox="0 0 96 96"><circle cx="48" cy="48" r="40" fill="#14b8a6"/><path d="M 28 43 A 21 21 0 0 1 48 29" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round"/><path d="M 68 53 A 21 21 0 0 1 48 67" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round"/></svg></span>`;
async function api(path,opts={}){opts.headers={'content-type':'application/json',...(opts.headers||{}),...(tok()?{Authorization:'Bearer '+tok()}:{})};const r=await fetch(path,opts);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||r.status);return d}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3200)}
function modal(html){const w=document.createElement('div');w.className='modal';w.innerHTML=`<div class="modalbox">${html}</div>`;w.addEventListener('click',e=>{if(e.target===w)w.remove()});document.body.append(w);w.querySelector('.xbtn')?.addEventListener('click',()=>w.remove());return w}
</script>
<script>
/* ============ APP ============ */
let VIEW='wallet';
let IS_ADMIN=false;
async function probeAdmin(){
  try{ await api('/api/admin/payments/treasury'); IS_ADMIN=true; }
  catch(e){ IS_ADMIN=false; }
}
function openDrawer(){
  const host=document.body;
  const existing = document.querySelector('.drawer-backdrop');
  if(existing) existing.remove();
  const el = document.createElement('div');
  el.id = 'drawerHost';
  document.body.appendChild(el);
  const host2 = el;
  host2.innerHTML=`<div class="drawer-backdrop" id="drawerBackdrop">
    <aside class="drawer" role="dialog" aria-label="Wallet menu">
      <div class="drawer-head"><span class="drawer-title">openLN</span><button class="xbtn" id="closeDrawer" aria-label="Close menu">✕</button></div>
      <nav class="drawer-nav">
        <button class="drawer-link ${VIEW==='wallet'?'on':''}" data-drawer-view="wallet">Wallet <span class="arrow">›</span></button>
        <button class="drawer-link ${VIEW==='cards'?'on':''}" data-drawer-view="cards">Cards <span class="arrow">›</span></button>
        <a class="drawer-link" id="cardShopLink" href="https://cards.openln.com">Card shop <span class="arrow">↗</span></a>
        <button class="drawer-link ${VIEW==='ric'?'on':''}" data-drawer-view="ric">RIC <span class="arrow">›</span></button>
        <button class="drawer-link ${VIEW==='extensions'?'on':''}" data-drawer-view="extensions">Extensions <span class="arrow">›</span></button>
        <button class="drawer-link ${VIEW==='partner'?'on':''}" data-drawer-view="partner">Partner <span class="arrow">›</span></button>
        ${IS_ADMIN?`<button class="drawer-link ${VIEW==='adminpayments'?'on':''}" data-drawer-view="adminpayments">Treasury <span class="arrow">›</span></button>`:''}
        <div class="drawer-divider"></div>
        <button class="drawer-link" id="drawerSettings">Settings <span class="arrow">›</span></button>
        <button class="drawer-link" id="drawerLogout">Log out <span class="arrow">→</span></button>
      </nav>
    </aside></div>`;
  const close=()=>{const h=document.getElementById('drawerHost');if(h)h.remove();$('#menuBtn')?.setAttribute('aria-expanded','false')};
  $('#menuBtn').setAttribute('aria-expanded','true');
  $('#closeDrawer').onclick=close;$('#drawerBackdrop').onclick=e=>{if(e.target.id==='drawerBackdrop')close()};
  host.querySelectorAll('[data-drawer-view]').forEach(b=>b.onclick=()=>{VIEW=b.dataset.drawerView;close();render()});
  $('#drawerSettings').onclick=async()=>{close();VIEW='settings';try{await render()}catch(e){console.error('settings render error',e);toast(e.message)}};
  $('#drawerLogout').onclick=()=>{close();localStorage.removeItem('openln_token');if(liveSource)liveSource.close();login()};
  $('#cardShopLink').onclick=async(e)=>{
    e.preventDefault();
    try{
      const r=await api('/api/auth/embed-token',{method:'POST'});
      if(r&&r.embedUrl){window.location.href=r.embedUrl;return}
    }catch(err){}
    window.location.href='https://cards.openln.com';
  };
}
async function boot(){
  if(!tok())return login();
  try{await api('/api/wallet/status')}catch(e){localStorage.removeItem('openln_token');return login()}
  await probeAdmin();
  render();
}
function login(){
  root.innerHTML=`<div class="login"><div class="loginbox">
    <div class="lg">${MARK}<span style="font-size:17px;font-weight:590;letter-spacing:-.3px">open<em style="font-style:normal;color:var(--teal)">LN</em></span></div>
    <div class="overline">Wallet core</div>
    <h1 style="margin-top:8px">Your wallet.<br>Your keys.</h1>
    <p class="sub">Connect your own Nostr Wallet Connect wallet. openLN never takes custody of your sats.</p>
    <form id="lf">
      <label class="field"><span>Handle</span><input class="input" name="handle" placeholder="satoshi" required autofocus></label>
      <button class="btn gold" style="width:100%;justify-content:center;padding:11px">Continue</button>
    </form>
    <p class="hint" id="lerr" style="color:var(--err)"></p>
    <p class="hint">New here? Enter a handle to create your wallet.</p>
  </div></div>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();
    const handle=new FormData(e.target).get('handle');
    $('#lerr').textContent='';
    let state;
    try{state=await api('/api/auth/access-state',{method:'POST',body:JSON.stringify({handle})})}
    catch(x){$('#lerr').textContent=x.message;return}
    if(!state.exists) return loginRegister(handle);
    if(state.legacyPin) return loginMigratePin(handle);
    return loginPassword(handle);
  };
}
function loginPassword(handle){
  root.innerHTML=`<div class="login"><div class="loginbox">
    <div class="lg">${MARK}<span style="font-size:17px;font-weight:590;letter-spacing:-.3px">open<em style="font-style:normal;color:var(--teal)">LN</em></span></div>
    <div class="overline">Wallet core</div>
    <h1 style="margin-top:8px">Welcome back.</h1>
    <p class="sub">Signing in as <b>${handle}</b>.</p>
    <form id="lf">
      <label class="field"><span>Password</span><input class="input" name="password" type="password" placeholder="••••••••" required autofocus></label>
      <button class="btn gold" style="width:100%;justify-content:center;padding:11px">Enter wallet</button>
    </form>
    <p class="hint" id="lerr" style="color:var(--err)"></p>
    <p class="hint"><a href="#" id="lback">← use a different handle</a></p>
  </div></div>`;
  $('#lback').onclick=e=>{e.preventDefault();login()};
  $('#lf').onsubmit=async e=>{e.preventDefault();const password=new FormData(e.target).get('password');
    try{const s=await api('/api/auth/login',{method:'POST',body:JSON.stringify({handle,password})});localStorage.setItem('openln_token',s.token);render()}
    catch(x){$('#lerr').textContent=x.message}};
}
function loginRegister(handle){
  root.innerHTML=`<div class="login"><div class="loginbox">
    <div class="lg">${MARK}<span style="font-size:17px;font-weight:590;letter-spacing:-.3px">open<em style="font-style:normal;color:var(--teal)">LN</em></span></div>
    <div class="overline">Wallet core</div>
    <h1 style="margin-top:8px">Create your wallet.</h1>
    <p class="sub">Handle <b>${handle}</b> is available. Choose a password.</p>
    <form id="lf">
      <label class="field"><span>Password</span><input class="input" name="password" type="password" placeholder="At least 12 characters" required autofocus minlength="12"></label>
      <button class="btn gold" style="width:100%;justify-content:center;padding:11px">Create wallet</button>
    </form>
    <p class="hint" id="lerr" style="color:var(--err)"></p>
    <p class="hint"><a href="#" id="lback">← use a different handle</a></p>
  </div></div>`;
  $('#lback').onclick=e=>{e.preventDefault();login()};
  $('#lf').onsubmit=async e=>{e.preventDefault();const password=new FormData(e.target).get('password');
    try{const s=await api('/api/auth/register',{method:'POST',body:JSON.stringify({handle,password})});localStorage.setItem('openln_token',s.token);render()}

function ricStepRow(n,label,state){ // state: 'pending'|'active'|'done'
  return `<div class="ricstep ${state}"><div class="ricstep-n">${state==='done'?'✓':n}</div><div class="ricstep-body"><div class="ricstep-label">${esc(label)}</div><div class="ricstep-slot" id="ricStepSlot${n}"></div></div></div>`;
}

function ricFlashModal(){
  const hasSerial = !!navigator.serial;
  let phase='idle'; let port=null;
  const m=modal(`<div class="modalhead"><div><h2>Flash device</h2><p class="dim" style="font-size:12px;margin-top:4px">Install RIC firmware over USB</p></div><button class="xbtn">✕</button></div>
    ${hasSerial?`
      <div class="ricsteps">
        ${ricStepRow(1,'Connect','active')}
        ${ricStepRow(2,'Flash firmware','pending')}
        ${ricStepRow(3,'Result','pending')}
      </div>
      <p class="dim" style="font-size:11.5px;text-align:center;margin-top:14px">Requires Chrome or Edge on desktop (USB access)</p>
    `:`<div class="warnbox">WebSerial is not available in this page context. Open this page in Chrome or Edge on desktop, then reconnect the USB device.</div>`}`);
  if(!hasSerial)return;
  const slot=n=>m.querySelector('#ricStepSlot'+n);
  const setStep=(n,state)=>{ m.querySelectorAll('.ricstep')[n-1].className='ricstep '+state; if(state==='done')m.querySelectorAll('.ricstep')[n-1].querySelector('.ricstep-n').textContent='✓'; };
  slot(1).innerHTML=`<button class="btn teal sm" id="ricConnect">Connect to device</button>`;
  m.querySelector('#ricConnect').onclick=async()=>{
    slot(1).innerHTML=`<span class="dim" style="font-size:12.5px">Opening port picker…</span>`;
    try{
      port=await navigator.serial.requestPort();
      setStep(1,'done'); slot(1).innerHTML=`<span style="color:var(--ok);font-size:12.5px">Port selected</span>`;
      setStep(2,'active');
      slot(2).innerHTML=`<button class="btn teal sm" id="ricFlash">Flash firmware</button>`;
      m.querySelector('#ricFlash').onclick=async()=>{
        slot(2).innerHTML=`<div class="ricprogress"><div class="ricprogress-bar" id="ricBar" style="width:0%"></div></div><p class="dim" style="font-size:11.5px;margin-top:6px" id="ricPct">0% written</p>`;
        setStep(3,'active'); slot(3).innerHTML=`<span class="dim" style="font-size:12.5px">Preparing…</span>`;
        try{
          const mod=await import('https://esm.sh/esptool-js@0.6.0');
          const transport=new mod.Transport(port,true);
          const loader=new mod.ESPLoader({transport,baudrate:115200,terminal:{clean:()=>{},writeLine:()=>{},write:()=>{}},enableTracing:false});
          const chip=await loader.main();
          const fwRes=await fetch('/api/posbox/firmware');
          if(!fwRes.ok)throw Error('Failed to download firmware');
          const data=new Uint8Array(await fwRes.arrayBuffer());
          await loader.writeFlash({fileArray:[{data,address:0x0}],flashSize:'keep',flashMode:'keep',flashFreq:'keep',eraseAll:false,compress:true,
            reportProgress:(_i,written,total)=>{ const pct=total>0?Math.round(written/total*100):0; const bar=m.querySelector('#ricBar'); if(bar)bar.style.width=pct+'%'; const p=m.querySelector('#ricPct'); if(p)p.textContent=pct+'% written'; }});
          await loader.softReset(false);
          setStep(2,'done'); slot(2).innerHTML=`<span style="color:var(--ok);font-size:12.5px">Written successfully${chip?' · '+esc(chip)+' detected':''}</span>`;
          setStep(3,'done'); slot(3).innerHTML=`<p style="color:var(--ok);font-size:12.5px;font-weight:590">Firmware installed</p><p class="dim" style="font-size:11.5px;margin-top:4px">The device will now boot and start Bluetooth provisioning. Use "Link device" to connect it to your account.</p>`;
        }catch(e){ setStep(3,'error'); slot(3).innerHTML=`<p style="color:var(--err);font-size:12.5px">${esc(e.message||'Flash failed')}</p><button class="btn ghost sm" id="ricRetryFlash" style="margin-top:8px">Try again</button>`; m.querySelector('#ricRetryFlash').onclick=()=>{m.remove();ricFlashModal();}; }
      };
    }catch(e){
      if(e && e.name==='NotFoundError'){ slot(1).innerHTML=`<button class="btn teal sm" id="ricConnect2">Connect to device</button>`; m.querySelector('#ricConnect2').onclick=()=>{m.remove();ricFlashModal();}; return; }
      setStep(1,'error'); slot(1).innerHTML=`<p style="color:var(--err);font-size:12.5px">${esc(e.message||'Failed to open port')}</p><button class="btn ghost sm" id="ricRetryConn" style="margin-top:8px">Try again</button>`;
      m.querySelector('#ricRetryConn').onclick=()=>{m.remove();ricFlashModal();};
    }
  };
}

          if(statusEl())statusEl().textContent='Issuing device token...';
          const tokenResp=await api('/api/accounts/'+RIC_ACCOUNT_ID+'/device-tokens',{method:'POST',body:JSON.stringify({label:deviceName||'RIC'})});
          issuedTokenId=tokenResp.id;
          if(statusEl())statusEl().textContent='Waiting for device to connect...';
          await cStatus.startNotifications();
          await new Promise((resolve,reject)=>{
            let settled=false;
            const settle=fn=>{ if(settled)return; settled=true; clearTimeout(timeout); device.removeEventListener('gattserverdisconnected',onDisconnect); fn(); };
            const timeout=setTimeout(()=>settle(()=>{ tokenWritten?resolve():reject(Error('Timed out — credentials not written to device')); }),45000);
            const onDisconnect=()=>settle(()=>{ tokenWritten?resolve():reject(Error('Device disconnected before provisioning completed')); });
            device.addEventListener('gattserverdisconnected',onDisconnect);
            cStatus.addEventListener('characteristicvaluechanged',ev=>{
              const dv=ev.target.value||new DataView(new ArrayBuffer(0));
              const raw=new TextDecoder('utf-8',{fatal:false}).decode(dv);
              const val=raw.replace(/\0.*$/,'').replace(/[^\x20-\x7E]/g,'').trim();
              if(val && statusEl())statusEl().textContent=val;
              if(val==='connected'){ settle(()=>resolve()); }
              else if(val.startsWith('error:')){ settle(()=>reject(Error(val.slice(6)||'Device reported an error'))); }
            });
            (async()=>{
              try{
                if(statusEl())statusEl().textContent='Writing to device...';
                await cSsid.writeValueWithoutResponse(ricEncode(ssidEl.value));
                await cPass.writeValueWithoutResponse(ricEncode(passEl.value));
                await cToken.writeValueWithoutResponse(ricEncode(tokenResp.token));
                tokenWritten=true;
                await cUrl.writeValueWithoutResponse(ricEncode(serverUrl));
                await cCurrency.writeValueWithoutResponse(ricEncode(currency));
                if(statusEl())statusEl().textContent='Waiting for device to connect...';
              }catch(e){ settle(()=>reject(e)); }
            })();
          });
          setStep(3,'done'); slot(3).innerHTML=`<p style="color:var(--ok);font-size:12.5px;font-weight:590">Device is ready to accept payments</p><p class="dim" style="font-size:11.5px;margin-top:4px">Your RIC is connected and linked to this account.</p>`;
          renderRicDevices();
        }catch(e){
          if(issuedTokenId && !tokenWritten){ api('/api/accounts/'+RIC_ACCOUNT_ID+'/device-tokens/'+issuedTokenId,{method:'DELETE'}).catch(()=>{}); }
          setStep(3,'error'); slot(3).innerHTML=`<p style="color:var(--err);font-size:12.5px">${esc(e.message||'Provisioning failed')}</p><button class="btn ghost sm" id="ricRetryLink" style="margin-top:8px">Try again</button>`;
          m.querySelector('#ricRetryLink').onclick=()=>{m.remove();ricLinkModal();};
        }
      };
    }catch(e){
      if(e && e.name==='NotFoundError'){ slot(1).innerHTML=`<button class="btn teal sm" id="ricScan2">Scan for nearby device</button>`; m.querySelector('#ricScan2').onclick=()=>{m.remove();ricLinkModal();}; return; }
      setStep(1,'error'); slot(1).innerHTML=`<p style="color:var(--err);font-size:12.5px">${esc(e.message||'Bluetooth scan failed')}</p><button class="btn ghost sm" id="ricRetryScan" style="margin-top:8px">Try again</button>`;
      m.querySelector('#ricRetryScan').onclick=()=>{m.remove();ricLinkModal();};
    }
  };
}

    <div>${admPill(w.wrapStatus,meta.label)}</div>
    <div class="mono" style="font-size:10.5px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">L1 ${admShort(w.paymentHash,8)} · L2 ${admShort(w.merchantPaymentHash,8)}${w.memo?' · '+esc(w.memo):''}</div>
    <div class="mono" style="font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${w.handle?'@'+esc(w.handle):'—'}${w.businessName?` <span class="dim">· ${esc(w.businessName)}</span>`:''}</div>
    <div style="text-align:right"><div style="font-weight:590">${fmt(w.amountSats)}</div>${(w.feeSats||0)>0?`<div class="mono" style="font-size:9.5px;color:var(--gold)">fee ${fmt(w.feeSats)}</div>`:''}</div>
    <div class="mono dim" style="font-size:9.5px">${ago(w.createdAt)}</div>
  </button>`;
}
function admTxRow(t){
  const pillColor=t.status==='completed'?'green':t.status==='failed'?'red':'amber';
  return `<button type="button" class="admrow" data-adm-id="${esc(t.id)}">
    <div class="k">${esc(t.direction)}·${esc(t.type)}</div>
    <div><span class="admpill ${pillColor}">${esc(t.status)}</span></div>
    <div class="mono" style="font-size:10.5px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${admShort(t.paymentHash,12)}${t.failureReason?' · '+esc(t.failureReason):''}${t.memo?' · '+esc(t.memo):''}</div>
    <div class="mono" style="font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.handle?'@'+esc(t.handle):'—'}${t.counterpartHandle?` <span class="dim">→ @${esc(t.counterpartHandle)}</span>`:''}</div>
    <div style="text-align:right;font-weight:590">${fmt(t.amountSats)}</div>
    <div class="mono dim" style="font-size:9.5px">${ago(t.createdAt)}</div>
  </button>`;
}
async function vAdminDetail(id){
  $('#view').innerHTML=`<div style="margin-top:30px" id="admRoot">
    <button class="backlink" id="admBack">‹ All payments</button>
    <div id="admDetailBody" style="margin-top:10px"><div style="padding:40px 0;text-align:center"><span class="spin"></span></div></div>
  </div>`;
  $('#admBack').onclick=()=>{ADM_ID=null;vAdminList()};
  await admRenderDetail(id);
  admStartDetailPoll(id);
}
function admStartDetailPoll(id){
  admStopPoll();
  ADM_POLL_TIMER=setInterval(()=>{ if(ADM_ID===id && VIEW==='adminpayments') admRenderDetail(id,true) },2000);
}
async function admRenderDetail(id,silent){
  const body=$('#admDetailBody'); if(!body) return;
  const noteVal=silent?($('#admNote')?.value??''):'';
  try{
    const d=await api(`/api/admin/payments/${encodeURIComponent(id)}`);
    const amt=d.invoice?d.invoice.amountSats:(d.transaction?d.transaction.amountSats:0);
    const statusLabel=d.invoice?.wrapStatus?(d.statusMeta?.label||d.invoice.wrapStatus):(d.transaction?.status||'');
    const statusColor=d.statusMeta?.color||(d.transaction?.status==='completed'?'green':d.transaction?.status==='failed'?'red':'amber');
    body.innerHTML=`
      <div class="card">
        <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start">
          <div>
            <div class="overline">${d.invoice?.wrapStatus?'Hold-wrap invoice':'Transaction'}</div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600;margin-top:4px">${fmt(amt)} <span class="dim" style="font-size:12px;font-weight:450">sats</span></div>
            <div class="dim" style="font-size:11.5px;margin-top:2px">${d.handle?'@'+esc(d.handle):''} ${d.businessName?'· '+esc(d.businessName):''}</div>
          </div>
          <span class="admpill ${statusColor}" style="font-size:11px;padding:4px 10px">${esc(d.invoice?.wrapStatus||d.transaction?.status||'')}${statusLabel?' — '+esc(statusLabel):''}</span>
        </div>
        ${d.pipeline?admPipelineBlock(d):''}
        <div class="admkv">
          ${admKv('ID',d.invoice?.id||d.transaction?.id)}
          ${admKv('Payment hash',d.invoice?.paymentHash||d.transaction?.paymentHash)}
          ${admKv('Merchant hash',d.invoice?.merchantPaymentHash)}
          ${admKv('Created',d.invoice?.createdAt||d.transaction?.createdAt)}
          ${admKv('Updated',d.invoice?.wrapUpdatedAt)}
          ${admKv('Paid at',d.invoice?.paidAt)}
          ${admKv('Preimages',d.invoice?`hold=${d.invoice.hasHoldPreimage?'yes':'no'} m=${d.invoice.hasPreimage?'yes':'no'}`:null)}
          ${admKv('Failure',d.transaction?.failureReason)}
        </div>
        ${(d.counterparts&&d.counterparts.length)?`<div style="margin-top:10px"><div class="overline">Legs on this hash</div><div class="admlegs">${d.counterparts.map(c=>`<button type="button" class="admleg" data-adm-id="${esc(c.id)}">${esc(c.direction)} @${esc(c.handle||'?')} · ${esc(c.status)} · ${fmt(c.amountSats)}</button>`).join('')}</div></div>`:''}
      </div>
      <div class="card">
        <h3>Manage</h3>
        <div class="admactions">
          ${d.actions?.canAdvance?'<button class="btn teal sm" data-adm-act="advance">Advance wrap</button>':''}
          ${d.actions?.canLookup?'<button class="btn ghost sm" data-adm-act="lookup">Live NWC lookup</button>':''}
          ${d.actions?.canRemediateTx?'<button class="btn ghost sm" data-adm-act="remediate">Remediate tx</button>':''}
          ${d.actions?.canRemediateTx?'<button class="btn ghost sm dangerText" data-adm-act="force-remediate">Force remediate</button>':''}
        </div>
        <div class="copyrow">
          <input class="input" id="admNote" placeholder="Ops note…" value="${esc(noteVal)}">
          <button class="btn ghost sm" id="admAddNote">Note</button>
        </div>
        <pre class="codebox mono" id="admActionMsg" style="font-size:10.5px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:10px;display:none;max-height:180px;overflow-y:auto"></pre>
        ${d.live?`<pre class="codebox mono" style="font-size:10.5px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:10px;max-height:140px;overflow-y:auto">LIVE: ${esc(JSON.stringify(d.live,null,2))}</pre>`:''}
      </div>
      <div class="card">
        <h3>Lifecycle timeline</h3>
        <div class="admtimeline" style="margin-top:10px">${(d.timeline||[]).map((ev,i,arr)=>admTimelineItem(ev,i===arr.length-1)).join('')}</div>
      </div>`;
    body.querySelectorAll('[data-adm-id]').forEach(b=>b.onclick=()=>{ADM_ID=b.dataset.admId;admRenderDetail(ADM_ID)});
    const msgBox=$('#admActionMsg');
    const showMsg=(txt)=>{msgBox.style.display='block';msgBox.textContent=txt};
    body.querySelectorAll('[data-adm-act]').forEach(b=>b.onclick=async()=>{
      const act=b.dataset.admAct;
      try{
        let out;
        if(act==='advance') out=await api(`/api/admin/payments/${encodeURIComponent(id)}/advance`,{method:'POST',body:JSON.stringify({})});
        else if(act==='lookup') out=await api(`/api/admin/payments/${encodeURIComponent(id)}/lookup`,{method:'POST',body:JSON.stringify({})});
        else if(act==='remediate'){ if(!confirm('Mark completed only with proof?'))return; out=await api(`/api/admin/payments/${encodeURIComponent(id)}/remediate-tx`,{method:'POST',body:JSON.stringify({})}); }
        else if(act==='force-remediate'){ if(!confirm('FORCE without wallet proof?'))return; out=await api(`/api/admin/payments/${encodeURIComponent(id)}/remediate-tx`,{method:'POST',body:JSON.stringify({force:true})}); }
        showMsg(JSON.stringify(out,null,2));
        await admRenderDetail(id);
      }catch(e){ showMsg(e.message); }
    });
    $('#admAddNote').onclick=async()=>{
      const note=$('#admNote').value.trim(); if(!note)return;
      try{ await api('/api/admin/payments/events',{method:'POST',body:JSON.stringify({paymentId:id,message:note})}); $('#admNote').value=''; toast('Note added'); await admRenderDetail(id); }
      catch(e){ showMsg(e.message); }
    };
  }catch(e){ if(!silent) body.innerHTML=`<div class="card"><p style="color:var(--err);font-size:13px">${esc(e.message)}</p></div>`; }
}
function admKv(label,value){
  if(value===null||value===undefined||value==='') return '';
  return `<div><div class="k">${esc(label)}</div><div class="v">${esc(String(value))}</div></div>`;
}
function admPipelineBlock(d){
  const steps=['created','accepted','forwarding','forwarded','settled'];
  const labels={created:'HOLD',accepted:'PAID',forwarding:'FWD',forwarded:'MRCH',settled:'SETL'};
  const cells=(d.pipeline||[]).map(s=>{
    const on=s.done||s.current;
    const style=s.current?'background:var(--teal);color:#eaffff':on?'background:var(--teal-dim);color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal-line)':'color:var(--text3);box-shadow:inset 0 0 0 1px var(--line)';
    return `<span class="mono" style="font-size:9px;padding:3px 7px;border-radius:5px;${style}">${labels[s.key]||s.key.slice(0,4).toUpperCase()}</span>`;
  }).join('<span class="dim" style="font-size:11px;padding:0 2px">→</span>');
  return `<div style="margin-top:14px">
    <div class="overline">Two-leg hold wrap</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">
      <div style="flex:1;min-width:180px;border:1px solid rgba(56,142,229,.3);background:rgba(56,142,229,.06);border-radius:8px;padding:8px 10px">
        <div class="mono" style="font-size:9px;letter-spacing:.08em;color:#7db8f0">1ST MILE · CUSTOMER → HOLD ${d.firstMile?.done?'✓':''}</div>
        <div style="font-weight:590;margin-top:3px">${fmt(d.firstMile?.amountSats)} sats</div>
        <div class="mono dim" style="font-size:9.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.firstMile?.paymentHash||'—')}</div>
      </div>
      <div style="flex:1;min-width:180px;border:1px solid rgba(167,139,250,.3);background:rgba(167,139,250,.06);border-radius:8px;padding:8px 10px">
        <div class="mono" style="font-size:9px;letter-spacing:.08em;color:#c4b3fb">2ND MILE · FLOAT → MERCHANT ${d.lastMile?.done?'✓':''}</div>
        <div style="font-weight:590;margin-top:3px">${fmt(d.lastMile?.amountSats)} sats ${d.lastMile?.feeSats?`<span style="color:var(--gold);font-size:11px;font-weight:450">fee ${fmt(d.lastMile.feeSats)}</span>`:''}</div>
        <div class="mono dim" style="font-size:9.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.lastMile?.paymentHash||'—')}</div>
      </div>
    </div>
    <div style="margin-top:8px">${cells}</div>
  </div>`;
}
function admTimelineItem(ev,isLast){
  return `<div class="admtl-item">
    <div style="display:flex;flex-direction:column;align-items:center">
      <div class="admtl-dot ${esc(ev.status||'info')}"></div>
      ${isLast?'':'<div class="admtl-line"></div>'}
    </div>
    <div class="admtl-body">
      <div class="admtl-meta">
        <span>${esc(new Date(ev.at).toLocaleString(undefined,{month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}))}</span>
        <span style="text-transform:uppercase;color:var(--text2)">${esc(ev.event)}</span>
        ${ev.mile?`<span style="text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 5px">${esc(String(ev.mile).replace('_',' '))}</span>`:''}
        ${ev.source==='event'?'<span style="color:var(--teal)">rec</span>':''}
        ${typeof ev.durationMs==='number'?`<span>${ev.durationMs}ms</span>`:''}
      </div>
      <div class="admtl-msg">${esc(ev.message||'')}</div>
      ${ev.errorMessage?`<div class="admtl-err">${ev.errorClass?'['+esc(ev.errorClass)+'] ':''}${esc(ev.errorMessage)}</div>`:''}
    </div>
  </div>`;
}
(function(){
  var root=document.documentElement;
  var saved=localStorage.getItem('openln_app_theme');
  if(saved==='light'){root.classList.add('light');}
  window.applyThemeToggle=function(){
    var t=document.getElementById('themeToggle');
    if(!t)return;
    t.textContent=root.classList.contains('light')?'☾':'☀';
    t.onclick=function(){root.classList.toggle('light');
      var light=root.classList.contains('light');
      localStorage.setItem('openln_app_theme',light?'light':'dark');
      t.textContent=light?'☾':'☀';};
  };
})();
boot();
</script></body></html>
