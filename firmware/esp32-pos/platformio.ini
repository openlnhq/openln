[env:esp32dev]
; Reproducible classic ESP32 build: Arduino 2.0.17, ESP-IDF 4.4.
platform             = espressif32 @ 6.13.0
board                = esp32dev
board_build.partitions = partitions.csv
build_src_filter     = +<*> -<test/> 
framework            = arduino
upload_speed         = 460800
upload_resetmethod   = nodemcu
monitor_speed        = 115200

lib_deps =
  bodmer/TFT_eSPI @ 2.5.43
  ; Touch VSPI is independent of display HSPI. PN532 is vendored under lib/.
  https://github.com/PaulStoffregen/XPT2046_Touchscreen#f956c5d8ce3bf39169c7378416b89e7cfe70a034
  arduino-libraries/Arduino_CRC32 @ 1.0.0
  adafruit/Adafruit BusIO @ 1.17.4
  bblanchon/ArduinoJson @ 7.4.3
  h2zero/NimBLE-Arduino @ 2.5.1
  ricmoo/QRCode @ 0.0.1

build_flags =
  -DUSER_SETUP_LOADED=1
  ; witnessmenow CYD reference uses ILI9341_2_DRIVER + USE_HSPI_PORT
  -DILI9341_2_DRIVER=1
  -DUSE_HSPI_PORT=1
  ; Display SPI — HSPI bus (GPIO 12/13/14/15)
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  ; Backlight managed by firmware via LEDC PWM — do NOT define TFT_BL here
  ; (TFT_eSPI would fight the LEDC channel for GPIO 21 control)
  ; Touch is on a SEPARATE SPI bus (VSPI: 25/32/39) — handled by
  ; XPT2046_Touchscreen library, NOT TFT_eSPI. No TOUCH_CS here.
  -DSPI_FREQUENCY=55000000
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  ; FONT6 (48px) and GLCD removed — never used in any screen, frees ~12-14KB flash.
  ; FONT_LARGE define kept in Theme.h for API compatibility but maps to FONT_SMALL.
